<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>壹页</title>
<meta name="description" content="一页装下每天要打开的站点">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<style>
  /* ══════════════════════════════════════════════════════════
     设计令牌
     暗色不用纯黑：分层灰阶 + 可见描边建立层次。
     纯黑会让卡片无处依附，观感上就是一个个"黑框"。
     ══════════════════════════════════════════════════════════ */
  :root {
    --bg:            #f5f5f7;
    --card:          #ffffff;
    --card-hover:    #ffffff;
    --nav-bg:        rgba(245, 245, 247, .76);

    --line:          rgba(0, 0, 0, .07);
    --line-strong:   rgba(0, 0, 0, .13);

    /* 文字：全部通过 WCAG AA */
    --t1:            #1d1d1f;   /* 16.8:1 */
    --t2:            #5f5f66;   /* 6.3:1 */
    --t3:            #86868b;

    --accent:        #0071e3;
    --accent-ink:    #0058b0;
    --accent-soft:   rgba(0, 113, 227, .09);
    --danger:        #d70015;
    --danger-soft:   rgba(215, 0, 21, .09);

    /* 头像恒定浅底：绝大多数品牌 logo 为深色/彩色，暗底会糊成一团 */
    --avatar-bg:     #f2f2f4;
    --avatar-ring:   rgba(0, 0, 0, .06);

    --sh-1: 0 1px 1px rgba(0,0,0,.03), 0 2px 6px rgba(0,0,0,.04);
    --sh-2: 0 2px 4px rgba(0,0,0,.04), 0 10px 26px rgba(0,0,0,.09);
    --sh-3: 0 10px 40px rgba(0,0,0,.13);
    --sh-modal: 0 24px 70px rgba(0,0,0,.24);
    --spot: radial-gradient(280px circle at var(--mx,50%) var(--my,50%), rgba(0,113,227,.07), transparent 62%);

    --r-card: 17px;
    --r-pill: 980px;
    --maxw:   1280px;

    --e-out:    cubic-bezier(.22, 1, .36, 1);
    --e-inout:  cubic-bezier(.65, 0, .35, 1);
    --e-spring: cubic-bezier(.34, 1.4, .5, 1);
    --fast: .18s;
    --mid:  .32s;
  }
  html[data-theme="dark"] {
    --bg:            #0b0b0d;
    --card:          #17171b;
    --card-hover:    #1e1e23;
    --nav-bg:        rgba(11, 11, 13, .74);

    --line:          rgba(255, 255, 255, .085);
    --line-strong:   rgba(255, 255, 255, .17);

    --t1:            #f2f2f5;   /* 16.2:1 */
    --t2:            #a6a6ad;   /* 7.5:1 */
    --t3:            #83838a;

    --accent:        #3d9bff;
    --accent-ink:    #8dc0ff;
    --accent-soft:   rgba(61, 155, 255, .13);
    --danger:        #ff6b6b;
    --danger-soft:   rgba(255, 107, 107, .13);

    --avatar-bg:     #f2f2f4;
    --avatar-ring:   rgba(255, 255, 255, .10);

    --sh-1: 0 1px 2px rgba(0,0,0,.4);
    --sh-2: 0 4px 10px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.4);
    --sh-3: 0 12px 44px rgba(0,0,0,.65);
    --sh-modal: 0 24px 70px rgba(0,0,0,.7);
    --spot: radial-gradient(280px circle at var(--mx,50%) var(--my,50%), rgba(61,155,255,.10), transparent 62%);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--t1);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }
  body.no-scroll { overflow: hidden; }
  ::selection { background: var(--accent-soft); color: var(--t1); }

  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line-strong); border-radius: 10px; border: 3px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--t3); }
  button, input, textarea { font: inherit; color: inherit; }

  /* ══════════════════════════════════════════════════════════
     导航
     ══════════════════════════════════════════════════════════ */
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(22px);
    -webkit-backdrop-filter: saturate(180%) blur(22px);
    border-bottom: 1px solid transparent;
    transition: border-color var(--mid) var(--e-out);
  }
  .nav.scrolled { border-bottom-color: var(--line); }
  .nav-inner {
    max-width: var(--maxw); margin: 0 auto; padding: 0 26px;
    height: 54px; display: flex; align-items: center; gap: 16px;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-size: 15px; font-weight: 620; letter-spacing: -.012em;
    color: var(--t1); text-decoration: none; white-space: nowrap;
    transition: opacity var(--fast);
  }
  .brand:hover { opacity: .72; }
  .brand-mark {
    width: 22px; height: 22px; flex: none;
    border-radius: 6.5px; background: var(--t1); position: relative;
    transition: transform .55s var(--e-spring);
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 6.5px;
    border: 2px solid var(--bg); border-radius: 50%;
  }
  .brand:hover .brand-mark { transform: rotate(90deg); }
  .brand-name { font-weight: 700; letter-spacing: .02em; }

  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  .search { position: relative; width: 186px; transition: width .42s var(--e-out); }
  .search:focus-within { width: 276px; }
  .search svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--t3); pointer-events: none;
    transition: color var(--fast) var(--e-out);
  }
  .search:focus-within svg { color: var(--accent); }
  #q {
    width: 100%; padding: 8px 30px 8px 32px;
    font-size: 13.5px; color: var(--t1);
    background: var(--accent-soft);
    border: 1px solid transparent; border-radius: var(--r-pill);
    outline: none;
    transition: background var(--mid) var(--e-out), border-color var(--mid) var(--e-out),
                box-shadow var(--mid) var(--e-out);
  }
  #q::placeholder { color: var(--t3); }
  #q:focus { background: var(--card); border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-soft); }
  #q::-webkit-search-cancel-button { display: none; }
  .clear {
    position: absolute; right: 5px; top: 50%;
    width: 22px; height: 22px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 50%;
    color: var(--t3); cursor: pointer; font-size: 15px; line-height: 1;
    translate: 0 -50%; scale: .7; opacity: 0;
    transition: opacity var(--fast) var(--e-out), scale var(--fast) var(--e-spring),
                background var(--fast), color var(--fast);
  }
  .search.has-value .clear { opacity: 1; scale: 1; }
  .clear:hover { background: var(--line-strong); color: var(--t1); }
  .kbd {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--t3); padding: 1px 5px;
    border: 1px solid var(--line-strong); border-radius: 5px;
    pointer-events: none;
    transition: opacity var(--fast) var(--e-out), transform var(--fast) var(--e-out);
  }
  .search:focus-within .kbd, .search.has-value .kbd { opacity: 0; transform: translateY(-50%) scale(.85); }

  .icon-btn {
    position: relative; flex: none;
    width: 34px; height: 34px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 50%;
    color: var(--t2); cursor: pointer;
    transition: background var(--fast) var(--e-out), color var(--fast) var(--e-out),
                scale var(--fast) var(--e-spring);
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--t1); }
  .icon-btn:active { scale: .88; }
  .icon-btn svg {
    position: absolute; width: 17px; height: 17px;
    transition: opacity var(--mid) var(--e-out), transform var(--mid) var(--e-spring);
  }
  html[data-theme="dark"] .icon-sun { opacity: 0; transform: rotate(-55deg) scale(.6); }
  html:not([data-theme="dark"]) .icon-moon { opacity: 0; transform: rotate(55deg) scale(.6); }
  html[data-theme="dark"] .icon-moon { opacity: 1; transform: rotate(0) scale(1); }
  html:not([data-theme="dark"]) .icon-sun { opacity: 1; transform: rotate(0) scale(1); }

  /* 编辑开关 */
  .edit-toggle {
    flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    height: 32px; padding: 0 13px;
    font-size: 13px; font-weight: 520;
    color: var(--t2);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    cursor: pointer; white-space: nowrap;
    transition: color var(--fast) var(--e-out), background var(--fast) var(--e-out),
                border-color var(--fast) var(--e-out), scale var(--fast) var(--e-spring);
  }
  .edit-toggle:hover { color: var(--t1); border-color: var(--line-strong); }
  .edit-toggle:active { scale: .96; }
  .edit-toggle svg { width: 14px; height: 14px; }
  body.editing .edit-toggle {
    color: #fff; background: var(--accent); border-color: var(--accent);
  }
  html[data-theme="dark"] body.editing .edit-toggle { color: #06131f; }
  .edit-toggle .lbl-on { display: none; }
  body.editing .edit-toggle .lbl-on { display: inline; }
  body.editing .edit-toggle .lbl-off { display: none; }

  /* ══════════════════════════════════════════════════════════
     Hero
     ══════════════════════════════════════════════════════════ */
  .hero {
    position: relative; max-width: var(--maxw); margin: 0 auto;
    padding: 68px 26px 34px;
    /* 与内容区同为左对齐 —— 一页内混用居中与左对齐会让版面散掉。
       极光是溢出元素，必须在此裁掉（body 的 overflow-x 挡不住文档被撑宽）。 */
    overflow: hidden;
  }
  .aurora {
    position: absolute; left: -140px; top: -230px;
    width: 760px; height: 460px;
    pointer-events: none; opacity: .65; filter: blur(58px);
    background:
      radial-gradient(circle at 34% 44%, rgba(0,113,227,.34), transparent 52%),
      radial-gradient(circle at 62% 30%, rgba(175,82,222,.24), transparent 54%),
      radial-gradient(circle at 20% 72%, rgba(255,55,95,.14), transparent 56%);
    animation: drift 24s var(--e-inout) infinite alternate;
  }
  html[data-theme="dark"] .aurora { opacity: .5; }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(26px, 22px) scale(1.07); }
    100% { transform: translate(-14px, -12px) scale(1.03); }
  }
  .hero-inner { position: relative; max-width: 640px; }
  .hero h1 {
    margin: 0 0 14px;
    font-size: clamp(34px, 5.4vw, 54px);
    font-weight: 700; letter-spacing: -.032em; line-height: 1.06;
    background: linear-gradient(180deg, var(--t1) 58%, color-mix(in srgb, var(--t1) 68%, transparent));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero .sub {
    margin: 0 0 30px;
    font-size: clamp(15.5px, 1.7vw, 18px); line-height: 1.55;
    color: var(--t2); letter-spacing: -.008em;
  }
  .stats { display: flex; gap: 0; }
  .stats .item { display: flex; flex-direction: column; gap: 3px; padding-right: 26px; }
  .stats .item + .item { padding-left: 26px; border-left: 1px solid var(--line); }
  .stats b {
    font-size: 21px; font-weight: 640; line-height: 1; color: var(--t1);
    letter-spacing: -.02em; font-variant-numeric: tabular-nums;
  }
  .stats .lbl { font-size: 12.5px; color: var(--t3); letter-spacing: .01em; }

  /* ══════════════════════════════════════════════════════════
     本地改动提示
     ══════════════════════════════════════════════════════════ */
  .dirty {
    display: none;
    max-width: var(--maxw); margin: 0 auto; padding: 0 26px;
  }
  body.has-local .dirty { display: block; }
  .dirty-inner {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 11px 15px;
    font-size: 13px; color: var(--t2);
    background: var(--accent-soft);
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    border-radius: 12px;
  }
  .dirty-inner strong { color: var(--t1); font-weight: 600; }
  .dirty-actions { margin-left: auto; display: flex; gap: 7px; }

  /* ══════════════════════════════════════════════════════════
     筛选
     ══════════════════════════════════════════════════════════ */
  .filters-wrap {
    position: sticky; top: 54px; z-index: 90;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(22px);
    -webkit-backdrop-filter: saturate(180%) blur(22px);
    border-bottom: 1px solid transparent;
    transition: border-color var(--mid) var(--e-out);
  }
  .filters-wrap.scrolled { border-bottom-color: var(--line); }
  .filters {
    max-width: var(--maxw); margin: 0 auto; padding: 12px 26px;
    display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    font-size: 13.5px; font-weight: 500;
    color: var(--t2);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    cursor: pointer; white-space: nowrap; text-decoration: none;
    scroll-margin-top: 120px;
    transition: color var(--fast) var(--e-out), background var(--fast) var(--e-out),
                border-color var(--fast) var(--e-out), box-shadow var(--fast) var(--e-out),
                transform var(--fast) var(--e-spring);
  }
  .chip:hover {
    color: var(--t1); border-color: var(--line-strong);
    box-shadow: var(--sh-1); transform: translateY(-1.5px);
  }
  .chip:active { transform: translateY(0) scale(.965); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip[aria-pressed="true"] {
    color: #fff; background: var(--t1); border-color: var(--t1);
    box-shadow: 0 2px 10px color-mix(in srgb, var(--t1) 22%, transparent);
  }
  html[data-theme="dark"] .chip[aria-pressed="true"] { color: #0b0b0d; }
  .chip .n { font-size: 11.5px; opacity: .55; font-variant-numeric: tabular-nums; }
  .chip[aria-pressed="true"] .n { opacity: .7; }

  /* ══════════════════════════════════════════════════════════
     内容
     ══════════════════════════════════════════════════════════ */
  main { max-width: var(--maxw); margin: 0 auto; padding: 44px 26px 96px; }
  section { margin-bottom: 54px; }
  section.hide { display: none; }

  .sec-head { display: flex; align-items: center; gap: 11px; margin: 0 0 19px; }
  .sec-head h2 {
    margin: 0; font-size: 21px; font-weight: 640;
    letter-spacing: -.022em; color: var(--t1);
  }
  .sec-head .meta { font-size: 13px; color: var(--t3); font-variant-numeric: tabular-nums; }
  .sec-actions { margin-left: auto; display: none; gap: 7px; align-items: center; }
  body.editing .sec-actions { display: flex; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 13px;
  }
  /* 编辑态给新增卡片留出的虚线占位 */
  .add-slot {
    display: none;
    align-items: center; justify-content: center; gap: 7px;
    min-height: 68px;
    border: 1.5px dashed var(--line-strong);
    border-radius: var(--r-card);
    background: none; color: var(--t3);
    font-size: 13.5px; white-space: nowrap;
    cursor: pointer;
    transition: color var(--fast), border-color var(--fast), background var(--fast), scale var(--fast) var(--e-spring);
  }
  body.editing .add-slot { display: flex; }
  /* 必须显式限尺寸：SVG 默认会撑满容器，加号会变成巨大图形 */
  .add-slot svg { width: 17px; height: 17px; flex: none; }
  .add-slot:hover {
    color: var(--accent); border-color: var(--accent);
    background: var(--accent-soft);
  }
  .add-slot:active { scale: .98; }

  /* ── 卡片 ───────────────────────────────────────────────── */
  /* 无 JS 时不显示这些纯 JS 驱动的控件 */
  html:not(.js) .totop,
  html:not(.js) .fab,
  html:not(.js) .locator,
  html:not(.js) .gh-badge,
  html:not(.js) .edit-toggle,
  html:not(.js) .view-toggle,
  html:not(.js) .filters-wrap,
  html:not(.js) .dirty { display: none !important; }

  .card {
    position: relative;
    display: flex; align-items: center; gap: 13px;
    padding: 14px 16px 14px 14px;
    min-width: 0; color: inherit; text-decoration: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    box-shadow: var(--sh-1);
    overflow: hidden;
    opacity: 0; transform: translateY(16px) scale(.985);
    transition:
      opacity .5s var(--e-out), transform .5s var(--e-out),
      box-shadow .3s var(--e-out), border-color .3s var(--e-out), background .3s var(--e-out);
  }
  .card.in { opacity: 1; transform: translateY(0) scale(1); }
  .card.hide { display: none; }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: var(--spot); opacity: 0;
    transition: opacity .3s var(--e-out); pointer-events: none;
  }
  .card:hover::before { opacity: 1; }
  .card:hover {
    transform: translateY(-3px) scale(1.006);
    background: var(--card-hover);
    border-color: var(--line-strong);
    box-shadow: var(--sh-2);
  }
  .card:active { transform: translateY(-1px) scale(.998); transition-duration: .07s; }
  .card:focus-visible { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-soft); }
  .avatar {
    position: relative; flex: none;
    width: 38px; height: 38px; border-radius: 10.5px;
    display: grid; place-items: center;
    background: var(--avatar-bg);
    box-shadow: inset 0 0 0 1px var(--avatar-ring);
    overflow: hidden;
    transition: transform .38s var(--e-spring);
  }
  .card:hover .avatar { transform: scale(1.07) rotate(-2.5deg); }
  .avatar img {
    width: 22px; height: 22px; display: block;
    /* 纯白 logo（Reddit 等）靠这圈投影在浅底上显形 */
    filter: drop-shadow(0 0 .6px rgba(0,0,0,.55)) drop-shadow(0 1px 1px rgba(0,0,0,.16));
  }
  .avatar .fb {
    display: none; width: 100%; height: 100%;
    place-items: center;
    font-size: 15px; font-weight: 650; color: #fff; letter-spacing: -.02em;
  }
  .avatar.failed img { display: none; }
  .avatar.failed .fb { display: grid; }
  .info { min-width: 0; flex: 1; }
  .info .t {
    display: block; font-size: 15px; font-weight: 560; letter-spacing: -.012em;
    color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .info .d {
    display: block; margin-top: 3px; font-size: 12.5px; line-height: 1.4;
    color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .arrow {
    flex: none; width: 15px; height: 15px; color: var(--t3);
    opacity: 0; transform: translateX(-6px);
    transition: opacity .28s var(--e-out), transform .28s var(--e-out), color .28s;
  }
  .card:hover .arrow { opacity: 1; transform: translateX(0); color: var(--accent); }
  mark { background: var(--accent-soft); color: var(--accent-ink); border-radius: 3px; padding: 0 1.5px; }
  .card.moving { transition: transform .34s var(--e-out), opacity .34s var(--e-out); }

  /* ── 编辑态卡片 ─────────────────────────────────────────── */
  .edit-bar { display: none; flex: none; align-items: center; gap: 2px; }
  body.editing .edit-bar { display: flex; }
  body.editing .arrow { display: none; }
  body.editing .card { cursor: default; }
  body.editing .card:hover { transform: none; }
  body.editing .card.dragging { opacity: .4; }
  body.editing .card.drop-before { box-shadow: -3px 0 0 0 var(--accent); }
  body.editing .card.drop-after  { box-shadow: 3px 0 0 0 var(--accent); }

  .mini {
    width: 28px; height: 28px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 7px;
    color: var(--t3); cursor: pointer;
    transition: background var(--fast), color var(--fast), scale var(--fast) var(--e-spring);
  }
  .mini:hover { background: var(--accent-soft); color: var(--accent); }
  .mini.del:hover { background: var(--danger-soft); color: var(--danger); }
  .mini:active { scale: .9; }
  .mini svg { width: 15px; height: 15px; }
  .grip { cursor: grab; }
  .grip:active { cursor: grabbing; }

  /* 分类标题的拖拽手柄 */
  .sec-grip {
    display: none; flex: none; width: 26px; height: 26px;
    place-items: center;
    background: none; border: 0; border-radius: 7px;
    color: var(--t3); cursor: grab;
    transition: background var(--fast), color var(--fast);
  }
  body.editing .sec-grip { display: grid; }
  .sec-grip:hover { background: var(--accent-soft); color: var(--accent); }
  .sec-grip:active { cursor: grabbing; }
  .sec-grip svg { width: 15px; height: 15px; }
  section.dragging { opacity: .45; }
  section.drop-target { outline: 2px dashed var(--accent); outline-offset: 8px; border-radius: 12px; }

  /* ── 通用按钮 ───────────────────────────────────────────── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    font-size: 13px; font-weight: 520;
    color: var(--t1);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 9px;
    cursor: pointer; white-space: nowrap;
    transition: color var(--fast), background var(--fast), border-color var(--fast), scale var(--fast) var(--e-spring);
  }
  .btn:hover { border-color: var(--line-strong); background: var(--card-hover); }
  .btn:active { scale: .97; }
  .btn svg { width: 14px; height: 14px; }
  .btn.primary { color: #fff; background: var(--accent); border-color: var(--accent); }
  html[data-theme="dark"] .btn.primary { color: #06131f; }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 32%, transparent); }
  .btn.danger:hover { background: var(--danger-soft); }
  .btn.ghost { background: none; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── 空状态 ─────────────────────────────────────────────── */
  .empty { display: none; padding: 96px 20px; text-align: center; }
  .empty.show { display: block; animation: pop .45s var(--e-out) both; }
  .empty svg { width: 40px; height: 40px; color: var(--t3); opacity: .45; margin-bottom: 16px; }
  .empty h3 { margin: 0 0 7px; font-size: 17.5px; font-weight: 620; color: var(--t1); }
  .empty p { margin: 0; color: var(--t2); font-size: 14px; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── 回到顶部 ───────────────────────────────────────────── */
  .totop {
    position: fixed; right: 28px; bottom: 28px; z-index: 95;
    width: 44px; height: 44px; display: grid; place-items: center;
    background: var(--card); border: 1px solid var(--line); border-radius: 50%;
    box-shadow: var(--sh-2); color: var(--t2); cursor: pointer;
    opacity: 0; visibility: hidden;
    transform: translateY(14px) scale(.86);
    transition: opacity .34s var(--e-out), transform .34s var(--e-spring),
                visibility .34s, color var(--fast) var(--e-out), box-shadow var(--fast);
  }
  .totop.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
  .totop:hover { color: var(--accent); box-shadow: var(--sh-3); transform: translateY(-3px) scale(1.06); }
  .totop:active { transform: translateY(-1px) scale(.97); }
  .totop svg.arrowup { width: 16px; height: 16px; }
  .totop svg.ring { position: absolute; inset: -1px; width: 46px; height: 46px; transform: rotate(-90deg); }
  .totop .ring circle {
    fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round;
    stroke-dasharray: 138.2;
    stroke-dashoffset: calc(138.2 - 138.2 * var(--progress, 0));
    opacity: .9; transition: stroke-dashoffset .1s linear;
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 28px 26px; max-width: var(--maxw); margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
    font-size: 12.5px; color: var(--t3);
  }
  footer a { color: var(--t2); text-decoration: none; transition: color var(--fast); }
  footer a:hover { color: var(--accent); }

  /* ── 骨架 ───────────────────────────────────────────────── */
  /* 默认隐藏：由 JS 在启动时加 .loading 显示。
     否则禁用 JS 时骨架屏会永远停留在加载动画上。 */
  .skeleton { display: none; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 13px; }
  html.js .skeleton { display: grid; }
  .sk { height: 70px; border-radius: var(--r-card); background: var(--card); position: relative; overflow: hidden; }
  .sk::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
    transform: translateX(-100%);
    animation: sweep 1.5s var(--e-inout) infinite;
  }
  @keyframes sweep { to { transform: translateX(100%); } }

  .reveal { opacity: 0; transform: translateY(20px); }
  .reveal.in {
    opacity: 1; transform: translateY(0);
    transition: opacity .75s var(--e-out), transform .75s var(--e-out);
  }

  /* ══════════════════════════════════════════════════════════
     弹窗
     ══════════════════════════════════════════════════════════ */
  .modal-mask {
    position: fixed; inset: 0; z-index: 200;
    display: none; align-items: center; justify-content: center;
    padding: 20px;
    background: rgba(0, 0, 0, .38);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .modal-mask.show { display: flex; animation: fade .18s var(--e-out); }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%; max-width: 430px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--sh-modal);
    overflow: hidden;
    animation: rise .28s var(--e-spring) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(16px) scale(.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .modal-head {
    display: flex; align-items: center; gap: 10px;
    padding: 17px 20px 13px;
    border-bottom: 1px solid var(--line);
  }
  .modal-head h3 { margin: 0; font-size: 16px; font-weight: 620; letter-spacing: -.015em; }
  .modal-close {
    margin-left: auto; width: 28px; height: 28px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 50%;
    color: var(--t3); cursor: pointer; font-size: 18px; line-height: 1;
    transition: background var(--fast), color var(--fast);
  }
  .modal-close:hover { background: var(--line); color: var(--t1); }
  .modal-body { padding: 18px 20px 4px; max-height: 60vh; overflow-y: auto; }
  .modal-foot {
    display: flex; gap: 8px; align-items: center;
    padding: 15px 20px 18px;
  }
  .modal-foot .btn.primary { margin-left: auto; }

  .field { margin-bottom: 15px; }
  .field label {
    display: block; margin-bottom: 6px;
    font-size: 12.5px; font-weight: 560; color: var(--t2);
  }
  .field label .opt { font-weight: 400; color: var(--t3); }
  .field input {
    width: 100%; padding: 9px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 9px; outline: none;
    transition: border-color var(--fast), box-shadow var(--fast);
  }
  .field input:focus { border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-soft); }
  .field input.bad { border-color: var(--danger); box-shadow: 0 0 0 3.5px var(--danger-soft); }
  .field .err { display: none; margin-top: 5px; font-size: 12px; color: var(--danger); }
  .field.bad .err { display: block; }
  .field .hint { margin-top: 5px; font-size: 11.5px; color: var(--t3); }
  .modal-note {
    padding: 0 20px 16px;
    font-size: 12px; line-height: 1.55; color: var(--t3);
  }
  .modal-note code {
    font-size: 11.5px; padding: 1px 5px;
    background: var(--line); border-radius: 4px;
  }

  /* ── 轻提示 ─────────────────────────────────────────────── */
  .toast-wrap {
    position: fixed; left: 50%; bottom: 28px; z-index: 300;
    translate: -50% 0;
    display: flex; flex-direction: column; gap: 8px; align-items: center;
    pointer-events: none;
  }
  .toast {
    display: flex; align-items: center; gap: 9px;
    padding: 10px 16px;
    font-size: 13.5px;
    color: var(--t1);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    box-shadow: var(--sh-3);
    animation: toastIn .3s var(--e-spring) both;
  }
  .toast.out { animation: toastOut .24s var(--e-out) both; }
  .toast svg { width: 15px; height: 15px; flex: none; }
  .toast.ok svg { color: #34c759; }
  .toast.err svg { color: var(--danger); }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(14px) scale(.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes toastOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(8px) scale(.96); }
  }

  /* ══════════════════════════════════════════════════════════
     响应式
     ══════════════════════════════════════════════════════════ */
  @media (max-width: 900px) {
    .search { width: 148px; }
    .search:focus-within { width: 200px; }
  }
  @media (max-width: 600px) {
    .nav-inner { padding: 0 16px; gap: 10px; }
    .brand span { display: none; }
    .search { flex: 1; width: auto; }
    .search:focus-within { width: auto; }
    .nav-right { flex: 1; }
    .edit-toggle { padding: 0 10px; }
    .edit-toggle .lbl-off, .edit-toggle .lbl-on { display: none; }
    .hero { padding: 40px 16px 26px; }
    .hero .sub { margin-bottom: 24px; }
    .filters { padding: 11px 16px; }
    .dirty { padding: 0 16px; }
    main { padding: 30px 16px 76px; }
    footer { padding: 22px 16px; flex-direction: column; align-items: flex-start; }
    .grid, .skeleton { grid-template-columns: 1fr; }
    .totop { right: 16px; bottom: 16px; width: 42px; height: 42px; }
    .kbd { display: none; }
    .stats .item { padding-right: 20px; }
    .stats .item + .item { padding-left: 20px; }
    /* 编辑态在触屏上没有 hover，操作按钮常驻 */
    body.editing .edit-bar { display: flex; }
  }
  @media (hover: none) {
    body.editing .edit-bar { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    html { scroll-behavior: auto; }
    .card { transform: none; opacity: 1; }
    .reveal { opacity: 1; transform: none; }
    .card:hover { transform: none; }
  }

  /* ══════════════════════════════════════════════════════════
     新增：收藏 + 视图切换 + 键盘导航
     ══════════════════════════════════════════════════════════ */

  /* 星标按钮：默认藏在卡片右上，悬停或已收藏时显现 */
  .star {
    position: absolute; top: 5px; right: 5px;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 7px;
    color: var(--t3); cursor: pointer;
    opacity: 0;
    transition: opacity var(--fast) var(--e-out), color var(--fast), background var(--fast),
                scale var(--fast) var(--e-spring);
  }
  .star svg { width: 14px; height: 14px; }
  .card:hover .star, .star.on, .star:focus-visible { opacity: 1; }
  .star:hover { background: var(--accent-soft); color: var(--accent); }
  .star.on { color: #f5a623; }
  .star.on svg { fill: #f5a623; stroke: #f5a623; }
  .star:active { scale: .85; }

  /* 已收藏卡片：左侧一道细金线，不打扰但一眼可辨 */
  .card.starred { border-color: color-mix(in srgb, #f5a623 34%, var(--line)); }
  .card.starred::after {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px;
    width: 2.5px; border-radius: 0 3px 3px 0;
    background: #f5a623;
  }

  /* 「常用」置顶分组：带淡金底以区别于普通分类 */
  section.pinned-sec {
    padding: 18px 18px 14px;
    margin-bottom: 44px;
    border-radius: 22px;
    background: color-mix(in srgb, #f5a623 6%, transparent);
    border: 1px solid color-mix(in srgb, #f5a623 22%, transparent);
  }
  section.pinned-sec .sec-head h2 { color: var(--t1); }
  .pin-hint {
    font-size: 12.5px; color: var(--t3);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .pin-hint svg { width: 13px; height: 13px; }

  /* 键盘焦点环：方向键导航时必须看得见 */
  .card.kb-focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3.5px var(--accent-soft), var(--sh-2);
    transform: translateY(-3px) scale(1.006);
  }
  .card.kb-focus::before { opacity: 1; }

  /* 移动端筛选条右侧渐隐：提示"右边还有内容" */
  .filters-wrap { position: sticky; }
  .filters-wrap::after {
    content: ""; position: absolute; top: 0; right: 0; bottom: 0;
    width: 52px; pointer-events: none;
    background: linear-gradient(90deg, transparent, var(--bg) 82%);
    opacity: 0; transition: opacity var(--mid) var(--e-out);
  }
  .filters-wrap.can-scroll-right::after { opacity: 1; }
  .filters-wrap.at-start::before {
    content: ""; position: absolute; top: 0; left: 0; bottom: 0;
    width: 40px; pointer-events: none; z-index: 1;
    background: linear-gradient(270deg, transparent, var(--bg) 82%);
  }

  /* 视图切换（网格 / 紧凑列表） */
  .view-toggle { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--line); }
  .view-toggle button {
    width: 28px; height: 26px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 7px;
    color: var(--t3); cursor: pointer;
    transition: background var(--fast), color var(--fast);
  }
  .view-toggle button svg { width: 14px; height: 14px; }
  .view-toggle button[aria-pressed="true"] { background: var(--card); color: var(--t1); box-shadow: var(--sh-1); }

  /* 紧凑列表模式：一屏看更多 */
  /* 卡片上移 / 下移（触屏排序用，因为 HTML5 拖拽在触屏不可靠） */
  .nudge { display: none; flex-direction: column; gap: 0; }
  body.editing .nudge { display: flex; }
  body.editing.on-touch .nudge { flex-direction: row; }
  .nudge button {
    width: 22px; height: 17px; display: grid; place-items: center;
    background: none; border: 0; border-radius: 5px;
    color: var(--t3); cursor: pointer;
    transition: background var(--fast), color var(--fast);
  }
  .nudge button:hover { background: var(--accent-soft); color: var(--accent); }
  .nudge button:disabled { opacity: .25; cursor: default; }
  .nudge button:disabled:hover { background: none; color: var(--t3); }
  .nudge svg { width: 12px; height: 12px; }

  /* 「添加站点」悬浮按钮：免去滚动到分类末尾 */
  .fab {
    position: fixed; right: 28px; bottom: 84px; z-index: 96;
    display: none; align-items: center; gap: 7px;
    height: 42px; padding: 0 17px;
    font-size: 14px; font-weight: 540;
    color: #fff; background: var(--accent);
    border: 0; border-radius: var(--r-pill);
    box-shadow: var(--sh-2); cursor: pointer;
    transition: transform var(--fast) var(--e-spring), filter var(--fast), opacity var(--mid);
  }
  body.editing .fab { display: inline-flex; }
  .fab:hover { filter: brightness(1.08); transform: translateY(-2px); }
  .fab:active { transform: scale(.96); }
  .fab svg { width: 15px; height: 15px; }

  /* 吸顶的分类定位条 */
  .locator {
    position: fixed; top: 15px; left: 50%; translate: -50% 0; z-index: 98;
    display: none; align-items: center; gap: 8px;
    height: 30px; padding: 0 13px;
    font-size: 13px; font-weight: 540; color: var(--t1);
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-pill); box-shadow: var(--sh-2);
    cursor: pointer;
    opacity: 0; transform: translateY(-8px);
    transition: opacity var(--mid) var(--e-out), transform var(--mid) var(--e-out);
  }
  .locator.show { display: inline-flex; opacity: 1; transform: translateY(0); }
  .locator svg { width: 13px; height: 13px; color: var(--t3); }
  .locator:hover { border-color: var(--line-strong); }

  /* 分类跳转面板 */
  .jump {
    position: fixed; inset: 0; z-index: 199;
    display: none; justify-content: center;
    padding: 66px 16px 16px;
    background: rgba(0,0,0,.30);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
  }
  .jump.show { display: flex; animation: fade .16s var(--e-out); }
  .jump-panel {
    width: 100%; max-width: 320px; align-self: flex-start;
    max-height: 70vh; overflow-y: auto;
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 16px; box-shadow: var(--sh-modal);
    padding: 8px;
    animation: rise .24s var(--e-spring) both;
  }
  .jump-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 12px;
    background: none; border: 0; border-radius: 10px;
    font-size: 14px; color: var(--t1); text-align: left;
    cursor: pointer;
    transition: background var(--fast);
  }
  .jump-item:hover { background: var(--accent-soft); }
  .jump-item .cnt { margin-left: auto; font-size: 12.5px; color: var(--t3); }
  .jump-item.cur { color: var(--accent); font-weight: 600; }

  /* GitHub 连接状态 */
  .gh-badge {
    display: none; align-items: center; gap: 6px;
    height: 32px; padding: 0 11px;
    font-size: 12.5px; font-weight: 520;
    color: var(--t2);
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-pill); cursor: pointer; white-space: nowrap;
    transition: border-color var(--fast), color var(--fast);
  }
  .gh-badge.show { display: inline-flex; }
  .gh-badge:hover { border-color: var(--line-strong); color: var(--t1); }
  .gh-badge svg { width: 14px; height: 14px; }
  .gh-badge.on { color: #34c759; border-color: color-mix(in srgb, #34c759 40%, transparent); }
  .gh-badge.on svg { color: #34c759; }

  /* 提示条上的按钮组 */
  .dirty-actions { margin-left: auto; display: flex; gap: 7px; flex-wrap: wrap; }

  /* 顶栏在小屏下的取舍 */
  @media (max-width: 760px) {
    .gh-badge .lbl { display: none; }
    .view-toggle { display: none; }
    .fab { right: 16px; bottom: 74px; height: 40px; padding: 0 14px; }
    .locator { top: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .star, .fab, .locator { transition: none !important; }
  }

  /* ══════════════════════════════════════════════════════════
     视图密度（三档：列表 / 网格 / 舒展）
     ══════════════════════════════════════════════════════════ */
  /* 网格：默认即标准网格，无需额外规则 */
  body.view-list .grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 7px; }
  body.view-list .card { padding: 9px 14px 9px 12px; border-radius: 12px; }
  body.view-list .avatar { width: 26px; height: 26px; border-radius: 8px; }
  body.view-list .avatar img { width: 16px; height: 16px; }
  body.view-list .avatar .fb { font-size: 12px; }
  body.view-list .info .d { display: none; }
  body.view-list .info .t { font-size: 14px; }
  body.view-list .star { top: 50%; translate: 0 -50%; right: 44px; }

  body.view-cozy .grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  body.view-cozy .card { padding: 18px 20px 18px 17px; border-radius: 20px; }
  body.view-cozy .avatar { width: 46px; height: 46px; border-radius: 13px; }
  body.view-cozy .avatar img { width: 27px; height: 27px; }
  body.view-cozy .info .t { font-size: 16px; }
  body.view-cozy .info .d { font-size: 13px; }

  /* ══════════════════════════════════════════════════════════
     操作历史（撤销）
     ══════════════════════════════════════════════════════════ */
  .undo-btn {
    position: relative; flex: none;
    display: none; align-items: center; gap: 5px;
    height: 32px; padding: 0 11px;
    font-size: 12.5px; font-weight: 520;
    color: var(--t2);
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-pill); cursor: pointer; white-space: nowrap;
    transition: color var(--fast), border-color var(--fast), scale var(--fast) var(--e-spring);
  }
  .undo-btn.show { display: inline-flex; }
  .undo-btn:hover { color: var(--t1); border-color: var(--line-strong); }
  .undo-btn:active { scale: .95; }
  .undo-btn svg { width: 13px; height: 13px; }

  /* ══════════════════════════════════════════════════════════
     首次访问引导
     ══════════════════════════════════════════════════════════ */
  .onboard {
    display: none;
    max-width: var(--maxw); margin: 0 auto; padding: 0 26px;
  }
  .onboard.show { display: block; animation: fadeUp .5s var(--e-out) both; }
  .onboard-inner {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 13px 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--sh-1);
  }

<script>
(function () {
  "use strict";

  /* 最早时刻标记「JS 可用」，让骨架屏与各类控件显隐有依据 */

  /* ══════════════════════════════════════════════════════════════

  var root = document.documentElement;

  var DEFAULT_REPO = { owner: "BorisXiao", name: "links", branch: "main", path: "links.json" };

  var PALETTE = ["#0071e3", "#af52de", "#ff375f", "#ff9f0a", "#30d158", "#40c8e0", "#5e5ce6", "#ff6482"];
  var PATH = {
    edit:   "M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z",
    trash:  "M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6",
    grip:   "M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01",
    arrow:  "M5 12h13M13 6l6 6-6 6",
    plus:   "M12 5v14M5 12h14",
    download: "M12 3v12M7 10l5 5 5-5M5 21h14",
    upload: "M12 21V9M7 14l5-5 5 5M5 3h14",
    check:  "M20 6L9 17l-5-5",
    alert:  "M12 8v5M12 17h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z",
    star:   "M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z",
    up:     "M12 19V6M6 12l6-6 6 6",
    down:   "M12 5v13M18 12l-6 6-6-6",

    copy:   "M9 9h10v10H9zM5 15H4V5h10v1",

    x:      "M18 6L6 18M6 6l12 12",
    key:    "M15.5 8.5a3.5 3.5 0 1 0-3.4 3.5L11 13H9v2H7v2H4v-3l6.1-6.1a3.5 3.5 0 0 1 5.4-1.4z",
    cloud:  "M17.5 19a4.5 4.5 0 0 0 .5-9 6 6 0 0 0-11.6 1.5A3.8 3.8 0 0 0 7 19z",

    var n = document.createElement(tag);

    if (text != null) n.textContent = text;
    return n;
  }
  function svgIcon(d, w, cls) {
    var s = document.createElementNS(SVG_NS, "svg");
    s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "none");
    s.setAttribute("stroke", "currentColor");
    s.setAttribute("stroke-width", w || "2");
    s.setAttribute("stroke-linecap", "round");
    s.setAttribute("stroke-linejoin", "round");
    s.setAttribute("aria-hidden", "true");
    if (cls) s.setAttribute("class", cls);
    var p = document.createElementNS(SVG_NS, "path");
    p.setAttribute("d", d);
    s.appendChild(p);
    return s;
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
  }
  function colorOf(s) {
    var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function highlight(text, q) {
    var safe = esc(text);
    if (!q) return safe;
    var i = safe.toLowerCase().indexOf(q.toLowerCase());
    if (i === -1) return safe;
    return safe.slice(0, i) + "<mark>" + safe.slice(i, i + q.length) + "</mark>" + safe.slice(i + q.length);
  }
  function safeGet(store, k) { try { return store.getItem(k); } catch (e) { return null; } }
  function safeSet(store, k, v) { try { store.setItem(k, v); return true; } catch (e) { return false; } }
  function safeDel(store, k) { try { store.removeItem(k); } catch (e) {} }

  /* ══════════════════════════════════════════════════════════════
     状态
     ══════════════════════════════════════════════════════════════ */
  var BASE = { title: "壹页", subtitle: "", categories: [] };   // 线上 links.json
  var DATA = { title: "壹页", subtitle: "", categories: [] };   // 当前生效数据（可能含本机编辑）
  var REPO = clone(DEFAULT_REPO);                               // 提交目标仓库
  var AUTH = null;                                              // links.json 里的 OAuth 配置
  var UI = { starred: [], recent: [], view: "grid", hidden: [] };
  var GH = { token: "", method: "", login: "" };                // GitHub 连接

  var editing = false;
  /* 编辑历史：每次数据变更前压入一份快照，用于撤销 */
  var history = [];
  var HISTORY_MAX = 40;
  var activeCat = "all";
  var query = "";
  var cards = [];
  var pinnedCat = "__pinned__";
  var recentCat = "__recent__";
  var pendingSec = null;
  var kbIndex = -1;
  var lastTrigger = null;

  var mainEl = $("main"), filtersEl = $("filters"), emptyEl = $("empty");
  var qEl = $("q"), searchbox = $("searchbox");
  var secObserver = (!reduceMotion && "IntersectionObserver" in window)
    ? new IntersectionObserver(function (es) {
        es.forEach(function (en) {
          if (en.isIntersecting) { en.target.classList.add("in"); secObserver.unobserve(en.target); }
        });
      }, { rootMargin: "140px 0px 0px 0px", threshold: 0 })
    : null;

  /* ══════════════════════════════════════════════════════════════
     持久化
     ══════════════════════════════════════════════════════════════ */
  function loadUI() {
    var raw = safeGet(localStorage, K_UI);
    if (!raw) return;
    try {
      var d = JSON.parse(raw);
      if (Array.isArray(d.starred)) UI.starred = d.starred;
      if (Array.isArray(d.recent)) UI.recent = d.recent;
      if (Array.isArray(d.hidden)) UI.hidden = d.hidden;
      if (d.view === "list" || d.view === "grid") UI.view = d.view;
    } catch (e) {}
  }
  function saveUI() {
    safeSet(localStorage, K_UI, JSON.stringify(UI));
  }
  function loadLocal() {
    var raw = safeGet(localStorage, K_DATA);
    if (!raw) return null;
    try { var d = JSON.parse(raw); return (d && Array.isArray(d.categories)) ? d : null; } catch (e) { return null; }
  }
  function persist() {
    if (!safeSet(localStorage, K_DATA, JSON.stringify(DATA))) {
      toast("本机存储写入失败（可能空间已满）", "err");
    }
    document.body.classList.add("has-local");
  }
  function dropLocal() {
    safeDel(localStorage, K_DATA);
    safeDel(localStorage, K_UI);
    /* 必须同步移除提示条状态：否则「恢复线上」后仍显示"本机改动尚未提交"，
       而此时本机已无改动 —— 提示与实际状态不符 */
    document.body.classList.remove("has-local");
  }
  function loadGH() {
    var raw = safeGet(localStorage, K_GH);
    if (!raw) return;
    try {
      var d = JSON.parse(raw);
      if (d && d.token) { GH.token = d.token; GH.method = d.method || "pat"; GH.login = d.login || ""; }
    } catch (e) {}
  }
  function saveGH() { safeSet(localStorage, K_GH, JSON.stringify(GH)); }
  function dropGH() { safeDel(localStorage, K_GH); GH = { token: "", method: "", login: "" }; }

  /* 图标缓存：减少重复请求，降低闪烁 */
  var iconCache = {};
  (function loadIconCache() {
    var raw = safeGet(localStorage, K_ICON);
    if (raw) { try { iconCache = JSON.parse(raw) || {}; } catch (e) { iconCache = {}; } }
  })();
  var iconCacheDirty = false;
  function saveIconCache() {
    if (!iconCacheDirty) return;
    iconCacheDirty = false;
    var keys = Object.keys(iconCache);
    if (keys.length > 200) {  // 控制体积，超量丢最旧的
      var trimmed = {};
      keys.slice(-160).forEach(function (k) { trimmed[k] = iconCache[k]; });
      iconCache = trimmed;
    }
    if (!safeSet(localStorage, K_ICON, JSON.stringify(iconCache))) iconCache = {};
  }

  /* ══════════════════════════════════════════════════════════════
     主题（带 View Transitions 动画）
     ══════════════════════════════════════════════════════════════ */
  var savedTheme = safeGet(localStorage, K_THEME);
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", savedTheme || (prefersDark ? "dark" : "light"));

  $("theme").addEventListener("click", function (e) {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    function apply() {
      root.setAttribute("data-theme", next);
      safeSet(localStorage, K_THEME, next);
    }
    if (!reduceMotion && document.startViewTransition) {
      /* 从按钮位置扩散的圆形揭示，比瞬变自然 */
      var r = e.currentTarget.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      var far = Math.hypot(Math.max(cx, innerWidth - cx), Math.max(cy, innerHeight - cy));
      var t = document.startViewTransition(apply);
      t.ready.then(function () {
        document.documentElement.animate(
          { clipPath: ["circle(0px at " + cx + "px " + cy + "px)", "circle(" + far + "px at " + cx + "px " + cy + "px)"] },
          { duration: 460, easing: "cubic-bezier(.22,1,.36,1)", pseudoElement: "::view-transition-new(root)" }
        );
      }).catch(function () {});
    } else apply();
  });

  /* ══════════════════════════════════════════════════════════════
     读屏播报：动态变化（搜索结果数、收藏、撤销）让辅助技术能感知
     ══════════════════════════════════════════════════════════════ */
  var liveEl = $("live"), liveTimer = null;
  function announce(msg) {
    if (!liveEl || !msg) return;
    /* 先清空再写入，确保相同文本也会被重新朗读 */
    liveEl.textContent = "";
    clearTimeout(liveTimer);
    liveTimer = setTimeout(function () { liveEl.textContent = msg; }, 60);
  }

  /* ══════════════════════════════════════════════════════════════
     轻提示
     ══════════════════════════════════════════════════════════════ */
  var toastWrap = $("toasts");
  function toast(msg, kind, ms) {
    var t = mk("div", "toast " + (kind === "err" ? "err" : "ok"));
    t.appendChild(svgIcon(kind === "err" ? PATH.alert : PATH.check));
    t.appendChild(mk("span", null, msg));

  /* ══════════════════════════════════════════════════════════════
     通用弹窗（链接 / 分类 / 确认 / GitHub / 批量导入 / 快捷键）
     ══════════════════════════════════════════════════════════════ */
  var mask = $("mask"), modalBody = $("modalBody");
  var modalOpen = false, modalCleanup = null;

  function openModal(title, buildBody, opts) {
    opts = opts || {};
    lastTrigger = document.activeElement;
    modalBody.innerHTML = "";

    var head = mk("div", "modal-head");
    head.appendChild(mk("h3", null, title)).id = "mTitle";
    var close = mk("button", "modal-close", "\u00d7");
    close.type = "button"; close.setAttribute("aria-label", "关闭");
    head.appendChild(close);
    modalBody.appendChild(head);

    var body = mk("div", "modal-body");
    modalBody.appendChild(body);

    var foot = mk("div", "modal-foot");
    modalBody.appendChild(foot);

    modalCleanup = buildBody(body, foot) || null;

    mask.classList.add("show");
    document.body.classList.add("no-scroll");
    modalOpen = true;

    close.addEventListener("click", closeModal);
    var focusTarget = modalBody.querySelector("[data-autofocus]") || modalBody.querySelector("input,button");
    if (focusTarget) setTimeout(function () { focusTarget.focus(); if (focusTarget.select) try { focusTarget.select(); } catch (e) {} }, 50);
    if (opts.wide) $("modal").style.maxWidth = "560px"; else $("modal").style.maxWidth = "";
  }
  function closeModal() {
    if (!modalOpen) return;
    modalOpen = false;
    if (typeof modalCleanup === "function") try { modalCleanup(); } catch (e) {}
    modalCleanup = null;
    mask.classList.remove("show");
    document.body.classList.remove("no-scroll");
    /* 焦点归还给触发元素 —— 键盘用户不该被丢回 body */
    if (lastTrigger && lastTrigger.focus && document.contains(lastTrigger)) {
      try { lastTrigger.focus(); } catch (e) {}
    }
    lastTrigger = null;
  }
  mask.addEventListener("click", function (e) { if (e.target === mask) closeModal(); });

  /* 焦点陷阱：Tab 不应跑到背景 */
  modalBody.addEventListener("keydown", function (e) {
    if (e.key !== "Tab") return;
    var f = modalBody.querySelectorAll('input,button,textarea,select,a[href],[tabindex]:not([tabindex="-1"])');
    f = Array.prototype.filter.call(f, function (n) { return !n.disabled && n.offsetParent !== null; });
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

    return { wrap: f, input: i, label: l };

      var fTags = field("搜索别名（可空，逗号分隔）", "只参与搜索、不显示在页面上");

  /* ══════════════════════════════════════════════════════════════
     GitHub：连接与提交
     ══════════════════════════════════════════════════════════════ */
  function ghHeaders() { return { "Authorization": "Bearer " + GH.token, "Accept": "application/vnd.github+json" }; }

  async function ghVerify(token) {
    var r = await fetch("https://api.github.com/user", { headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" } });
    if (!r.ok) throw new Error(r.status === 401 ? "token 无效或已过期" : "验证失败（HTTP " + r.status + "）");
    var u = await r.json();
    return { login: u.login, id: u.id };
  }

  async function ghGetFile() {
    var url = "https://api.github.com/repos/" + REPO.owner + "/" + REPO.name + "/contents/" + REPO.path +
              "?ref=" + encodeURIComponent(REPO.branch) + "&t=" + Date.now();
    var r = await fetch(url, { headers: ghHeaders(), cache: "no-store" });
    if (r.status === 404) throw new Error("仓库中找不到 " + REPO.path + "（检查仓库名与路径）");
    if (r.status === 401) throw new Error("token 已失效，请重新连接");
    if (r.status === 403) throw new Error("token 权限不足（fine-grained token 需勾 Contents: Read and write）");
    if (!r.ok) throw new Error("读取失败 HTTP " + r.status);
    var d = await r.json();
    return { sha: d.sha, text: decodeURIComponent(escape(atob((d.content || "").replace(/\n/g, "")))) };
  }

  async function ghPutFile(text, sha, message) {
    var url = "https://api.github.com/repos/" + REPO.owner + "/" + REPO.name + "/contents/" + REPO.path;
    var r = await fetch(url, {
      method: "PUT",
      headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()),
      body: JSON.stringify({
        message: message,
        content: btoa(unescape(encodeURIComponent(text))),
        sha: sha,
        branch: REPO.branch
      })
    });
    if (r.status === 409) throw Object.assign(new Error("conflict"), { code: 409 });
    if (r.status === 401) throw new Error("token 已失效，请重新连接");
    if (r.status === 403) throw new Error("token 权限不足（fine-grained token 需勾 Contents: Read and write）");
    if (!r.ok) {
      var msg = "提交失败 HTTP " + r.status;
      try { var j = await r.json(); if (j.message) msg += "：" + j.message; } catch (e) {}
      throw new Error(msg);
    }
    return await r.json();
  }

  function serialized() {
    return JSON.stringify({ title: DATA.title, subtitle: DATA.subtitle, categories: DATA.categories }, null, 2) + "\n";
  }

  /* 把本机改动推送到 GitHub */
  async function pushToGitHub(silent) {
    if (!GH.token) { openGhModal(); return; }
    var z = await loadingToast("正在提交到 GitHub…");
    try {
      var cur = await ghGetFile();
      var next = serialized();
      if (cur.text.replace(/\s+$/, "") === next.replace(/\s+$/, "")) {
        z.done();
        if (!silent) toast("本机内容与线上一致，无需提交");
        return;
      }
      try {
        var res = await ghPutFile(next, cur.sha, "chore: 更新站点（来自壹页编辑器）");
        z.done();
        /* 提交成功后：线上即本机内容，清掉本机改动标记，让站点回归"线上为准" */
        BASE = clone(DATA);
        dropLocalKeepUI();
        updateDirtyBar();
        render();
        toast("已提交到 GitHub" + (res.commit && res.commit.sha ? "（" + res.commit.sha.slice(0, 7) + "）" : ""), "ok", 3200);
      } catch (err) {
        if (err.code === 409) {
          z.done();
          askConfirm("线上文件已变更",
            "提交被拒绝：线上 links.json 在你这段时间里被别处改过。直接覆盖会丢掉那部分改动。要用当前内容覆盖线上吗？",
            "覆盖线上", async function () {
              var fresh = await ghGetFile();
              try {
                await ghPutFile(serialized(), fresh.sha, "chore: 更新站点（来自壹页编辑器，覆盖冲突版本）");
                BASE = clone(DATA); dropLocalKeepUI(); updateDirtyBar(); render();
                toast("已覆盖提交", "ok", 3000);
              } catch (e2) { toast(e2.message, "err", 5000); }
            });
          return;
        }
        throw err;
      }
    } catch (err) {
      z.done();
      toast(err.message || "提交失败", "err", 5000);
    }
  }
  function dropLocalKeepUI() {
    safeDel(localStorage, K_DATA);
    document.body.classList.remove("has-local");
  }

      function renderOAuth() {

            "本项目已在 <code>worker/</code> 目录提供完整实现与部署文档。<br>" +
            "部署后，把 <code>clientId</code> 与 <code>workerUrl</code> 填进 <code>links.json</code> 的 <code>auth</code> 字段，" +
            "这里就会出现登录按钮。"));
          var close2 = btn("知道了", "primary");
          close2.addEventListener("click", closeModal);
          foot.appendChild(close2);
          return;
        }
        panel.appendChild(modalNote(
          "点击下面的按钮会跳转到 GitHub 授权。<br>" +
          "授权范围仅限本仓库的 Contents 读写，且服务端会校验只有你本人可以使用。"));
        var go = btn("使用 GitHub 登录", "primary");
        go.addEventListener("click", function () {
          var state = Math.random().toString(36).slice(2) + Date.now().toString(36);
          safeSet(sessionStorage, "gh_oauth_state", state);

  /* OAuth 回调处理：?code=... 回来时换取 token */
  async function handleOAuthCallback() {
    var sp = new URLSearchParams(location.search);
    var code = sp.get("code"), state = sp.get("state");
    if (!code) return false;
    var expect = safeGet(sessionStorage, "gh_oauth_state");
    safeDel(sessionStorage, "gh_oauth_state");
    /* 立刻清掉地址栏里的 code，避免被复制分享出去 */
    try { history.replaceState(null, "", location.origin + location.pathname + location.hash); } catch (e) {}
    if (!AUTH || !AUTH.workerUrl) { toast("未配置 OAuth 服务，无法完成登录", "err", 4000); return true; }
    if (!expect || state !== expect) { toast("授权校验失败（state 不匹配），已中止", "err", 4500); return true; }
    var z = loadingToast("正在完成授权…");
    try {
      var r = await fetch(AUTH.workerUrl.replace(/\/$/, "") + "/token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code })
      });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok || !j.token) throw new Error(j.message || j.error || ("授权失败 HTTP " + r.status));
      GH = { token: j.token, method: "oauth", login: "" };
      try { var u = await ghVerify(j.token); GH.login = u.login; } catch (e) {}
      saveGH(); updateGhBadge();
      z.done();
      toast("已通过 GitHub 登录" + (GH.login ? "：" + GH.login : ""));
    } catch (err) {
      z.done();
      toast(err.message || "授权失败", "err", 5000);
    }
    return true;
  }

  function updateGhBadge() {
    var b = $("ghBadge"), t = $("ghBadgeText");
    if (GH.token) {
      b.classList.add("show", "on");
      t.textContent = GH.login ? (GH.login + " · " + (GH.method === "oauth" ? "OAuth" : "Token")) : "已连接";
    } else {
      b.classList.remove("on");
      b.classList.add("show");
      t.textContent = "连接 GitHub";
    }
  }
  $("ghBadge").addEventListener("click", function () {
    if (GH.token) {
      openModal("GitHub 连接", function (body, foot) {
