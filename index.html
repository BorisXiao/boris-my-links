  /* ══════════════════════════════════════════════════════════════
     数据渲染
     ══════════════════════════════════════════════════════════════ */
  function catByName(name) {
    for (var i = 0; i < DATA.categories.length; i++) if (DATA.categories[i].name === name) return DATA.categories[i];
    return null;
  }
  function isStarred(url) { return UI.starred.indexOf(url) > -1; }
  function toggleStar(url) {
    var i = UI.starred.indexOf(url);
    if (i > -1) UI.starred.splice(i, 1); else UI.starred.unshift(url);
    saveUI();
  }
  function pushRecent(url) {
    var i = UI.recent.indexOf(url);
    if (i > -1) UI.recent.splice(i, 1);
    UI.recent.unshift(url);
    if (UI.recent.length > 12) UI.recent.length = 12;
    saveUI();
  }
  function collectByUrls(urls) {
    var out = [], seen = {};
    urls.forEach(function (u) {
      if (seen[u]) return;
      DATA.categories.forEach(function (c) {
        c.links.forEach(function (l) { if (l.url === u && !seen[u]) { seen[u] = 1; out.push({ link: l, cat: c.name }); } });
      });
    });
    return out;
  }

  /* 同一站点可能同时出现在收藏区与原分类里，星标必须同步 */
  function refreshStarState(url) {
    var on = isStarred(url);
    mainEl.querySelectorAll("a.card").forEach(function (c) {
      var s = c.querySelector(".star");
      if (!s) return;
      var isThis = false;
      try { isThis = new URL(c.getAttribute("href"), location.href).href === new URL(url, location.href).href; } catch (e) { isThis = c.getAttribute("href") === url; }
      if (!isThis) return;
      s.classList.toggle("on", on);
      s.title = on ? "取消收藏" : "收藏";
      s.setAttribute("aria-label", s.title + " " + (c.querySelector(".t").textContent || ""));
      c.classList.toggle("starred", on);
    });
  }

  /* 收藏数变化后，统计项与页脚要跟着更新（旧实现只刷了收藏区） */
  function refreshCounts() {
    var total = DATA.categories.reduce(function (a, c) { return a + c.links.length; }, 0);
    renderStats(total, DATA.categories.length);
    $("footCount").textContent = "共 " + total + " 个站点，分 " + DATA.categories.length + " 类" +
      (UI.starred.length ? " · 已收藏 " + UI.starred.length + " 个" : "");
  }

  function iconSources(link, host) {
    var list = [];
    if (link.icon) {
      var base = link.url.slice(-1) === "/" ? link.url.slice(0, -1) : link.url;
      list.push(base + link.icon);
    }
    list.push("https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(host));
    return list;
  }

  function buildCard(link, catName, idx, virtualKey) {
    var host = hostOf(link.url);
    var a = mk("a", "card");
    a.href = link.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = link.name + " — " + link.url;
    if (isStarred(link.url)) a.classList.add("starred");

    /* 头像 */
    var av = mk("span", "avatar");
    var img = mk("img");
    img.loading = "lazy"; img.alt = ""; img.referrerPolicy = "no-referrer"; img.decoding = "async";
    var sources = iconSources(link, host), si = 0;
    var cached = iconCache[host];
    function nextSrc() {
      si++;
      if (si < sources.length) { img.src = sources[si]; return; }
      av.classList.add("failed");
      if (img.parentNode) img.remove();
    }
    img.addEventListener("error", nextSrc);
    img.addEventListener("load", function () {
      if (!img.naturalWidth || !img.naturalHeight) { nextSrc(); return; }
      /* 缓存成功的图标地址，减少下次请求 */
      if (!cached && img.src.indexOf("data:") !== 0) {
        iconCache[host] = img.src;
        iconCacheDirty = true;
        clearTimeout(saveIconCache._t);
        saveIconCache._t = setTimeout(saveIconCache, 1500);
      }
    });
    img.src = cached || sources[0];
    var fb = mk("span", "fb", (link.name || host || "?").trim().charAt(0).toUpperCase());
    fb.style.background = colorOf(link.name || host);
    av.appendChild(img); av.appendChild(fb);

    /* 文本 */
    var info = mk("span", "info");
    var elName = mk("span", "t");
    var elDesc = mk("span", "d");
    info.appendChild(elName); info.appendChild(elDesc);

    var arrow = svgIcon(PATH.arrow, "2.4", "arrow");
    a.appendChild(av); a.appendChild(info); a.appendChild(arrow);

    /* 星标（非编辑态也可用） */
    var star = mk("button", "star" + (isStarred(link.url) ? " on" : ""));
    star.type = "button";
    star.title = isStarred(link.url) ? "取消收藏" : "收藏";
    star.setAttribute("aria-label", star.title + " " + (link.name || ""));
    star.appendChild(svgIcon(PATH.star, "1.9"));
    star.addEventListener("click", function (e) {
      e.preventDefault(); e.stopPropagation();
      toggleStar(link.url);
      refreshStarState(link.url);
      renderPinned();
      refreshCounts();
      var on = isStarred(link.url);
      toast(on ? "已收藏「" + (link.name || host) + "」" : "已取消收藏");
      announce(on ? "已收藏 " + (link.name || host) : "已取消收藏 " + (link.name || host));
    });
    a.appendChild(star);

    /* 编辑态操作区 */
    if (virtualKey == null) {
      var bar = mk("span", "edit-bar");
      var grip = mk("span", "mini grip");
      grip.title = "拖拽排序";
      grip.appendChild(svgIcon(PATH.grip));
      var bEdit = mk("button", "mini"); bEdit.type = "button"; bEdit.title = "编辑";
      bEdit.setAttribute("aria-label", "编辑 " + (link.name || ""));
      bEdit.appendChild(svgIcon(PATH.edit, "1.9"));
      var bDel = mk("button", "mini del"); bDel.type = "button"; bDel.title = "删除";
      bDel.setAttribute("aria-label", "删除 " + (link.name || ""));
      bDel.appendChild(svgIcon(PATH.trash, "1.9"));
      bar.appendChild(grip); bar.appendChild(bEdit); bar.appendChild(bDel);

      /* 触屏备用排序按钮 */
      var nudge = mk("span", "nudge");
      var bUp = mk("button"); bUp.type = "button"; bUp.title = "上移"; bUp.appendChild(svgIcon(PATH.up, "2.2"));
      var bDown = mk("button"); bDown.type = "button"; bDown.title = "下移"; bDown.appendChild(svgIcon(PATH.down, "2.2"));
      var cat = catByName(catName);
      bUp.disabled = idx <= 0;
      bDown.disabled = !cat || idx >= cat.links.length - 1;
      function move(dir) {
        var c = catByName(catName);
        if (!c) return;
        var to = idx + dir;
        if (to < 0 || to >= c.links.length) return;
        pushHistory("移动「" + (c.links[idx].name || "") + "」");
        var m = c.links.splice(idx, 1)[0];
        c.links.splice(to, 0, m);
        persist(); render(); updateDirtyBar();
      }
      bUp.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); move(-1); });
      bDown.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); move(1); });
      nudge.appendChild(bUp); nudge.appendChild(bDown);
      bar.appendChild(nudge);

      a.appendChild(bar);

      a.addEventListener("click", function (e) {
        if (!editing) { pushRecent(link.url); return; }
        e.preventDefault();
        openLinkModal(catName, idx);
      });
      bEdit.addEventListener("click", function (e) { e.preventDefault(); e.stopPropagation(); openLinkModal(catName, idx); });
      bDel.addEventListener("click", function (e) {
        e.preventDefault(); e.stopPropagation();
        var label = link.name || host;
        askConfirm("删除站点", "确定删除「" + label + "」？此操作只影响本机编辑内容。", "删除", function () {
          var c = catByName(catName);
          if (!c) return;
          pushHistory("删除「" + label + "」");
          var i = c.links.indexOf(link);
          if (i > -1) c.links.splice(i, 1);
          persist(); render(); updateDirtyBar();
          toast("已删除「" + label + "」");
        });
      });
    } else {
      a.addEventListener("click", function () { if (!editing) pushRecent(link.url); });
    }

    if (!reduceMotion) {
      a.addEventListener("pointermove", function (e) {
        var r = a.getBoundingClientRect();
        a.style.setProperty("--mx", (e.clientX - r.left) + "px");
        a.style.setProperty("--my", (e.clientY - r.top) + "px");
      });
    }

    return {
      el: a, elName: elName, elDesc: elDesc, cat: catName,
      name: link.name || host, desc: link.desc || host, url: link.url,
      hay: ((link.name || "") + " " + (link.desc || "") + " " + (link.url || "") + " " + host + " " +
            (Array.isArray(link.tags) ? link.tags.join(" ") : "")).toLowerCase()
    };
  }

  function buildSection(opts) {
    var sec = mk("section");
    sec.id = opts.id || ("c-" + opts.cat);
    sec.dataset.cat = opts.cat;
    if (opts.pinned) sec.classList.add("pinned-sec");
    if (!reduceMotion) sec.classList.add("reveal");

    var head = mk("div", "sec-head");
    if (!opts.pinned && opts.cat !== recentCat) {
      var grip = mk("span", "sec-grip");
      grip.title = "拖拽调整分类顺序";
      grip.appendChild(svgIcon(PATH.grip));
      head.appendChild(grip);
    }
    head.appendChild(mk("h2", null, opts.title));
    var meta = mk("span", "meta", opts.links.length + " 个站点");
    head.appendChild(meta);

    if (opts.pinned) {
      var hint = mk("span", "pin-hint");
      hint.appendChild(svgIcon(PATH.star, "2"));
      hint.appendChild(mk("span", null, "在卡片右上角点星标即可收藏"));
      head.appendChild(hint);
    }
    if (opts.actions) head.appendChild(opts.actions);
    sec.appendChild(head);

    var grid = mk("div", "grid");
    grid.dataset.cat = opts.cat;
    opts.links.forEach(function (entry, i) {
      var card = buildCard(entry.link, entry.cat, entry.idx, entry.virtual);
      cards.push(card);
      grid.appendChild(card.el);
    });
    sec.appendChild(grid);
    return { sec: sec, grid: grid };
  }

  /* 所有数据变更统一走这里：先记录快照，再持久化与重渲染 */
  function act(label) {
    pushHistory(label);
    persist();
    render();
    updateDirtyBar();
  }

  /* 撤销实现：把快照写回 DATA → 持久化 → 重渲染。
     记录期间会暂停新快照入栈（直接对 DATA 赋值，不走 pushHistory）。 */
  function pushHistory(label) {
    try {
      var snap = JSON.stringify(DATA);
      if (history.length && history[history.length - 1].snap === snap) return;
      history.push({ snap: snap, label: label || "编辑" });
      if (history.length > HISTORY_MAX) history.shift();
      updateUndoBtn();
    } catch (e) {}
  }
  function undo() {
    if (!history.length) return;
    var prev = history.pop();
    try {
      DATA = JSON.parse(prev.snap);
    } catch (e) { return; }
    persist();
    closeModalQuiet();
    render();
    updateDirtyBar();
    updateUndoBtn();
    /* 线上数据本就干净时，撤销回该状态就不该再标"有本机改动" */
    if (JSON.stringify(DATA) === JSON.stringify(BASE)) {
      safeDel(localStorage, K_DATA);
      document.body.classList.remove("has-local");
    }
    toast("已撤销：" + prev.label);
    announce("已撤销 " + prev.label);
  }
  function closeModalQuiet() { if (modalOpen) closeModal(); }
  function updateUndoBtn() {
    var b = $("undoBtn");
    if (!b) return;
    b.classList.toggle("show", history.length > 0);
    var lbl = b.querySelector(".lbl");
    if (lbl) lbl.textContent = history.length ? ("撤销" + (history.length > 1 ? " (" + history.length + ")" : "")) : "撤销";
  }

  function render() {
    var skel = $("skeleton");
    if (skel) skel.remove();
    mainEl.innerHTML = "";
    filtersEl.innerHTML = "";
    cards = [];
    kbIndex = -1;
    kbEl = null;

    var cats = DATA.categories || [];
    if (DATA.title) {
      $("heroTitle").textContent = DATA.title;
      $("brandText").textContent = DATA.title;
      document.title = DATA.title;
    }
    $("heroSub").textContent = DATA.subtitle || "";
    (cats || []).forEach(function (c) { if (!c.links) c.links = []; });

    var totalAll = cats.reduce(function (n, c) { return n + c.links.length; }, 0);

    /* 筛选 chip */
    function chip(label, value, count) {
      var b = mk("a", "chip");
      b.href = value === "all" ? "#" : "#cat=" + encodeURIComponent(value);
      b.setAttribute("aria-pressed", String(activeCat === value));
      b.dataset.value = value;
      b.appendChild(mk("span", null, label));
      b.appendChild(mk("span", "n", count));
      b.addEventListener("click", function (e) { e.preventDefault(); setCat(value); b.blur(); });
      return b;
    }
    filtersEl.appendChild(chip("全部", "all", totalAll));
    cats.forEach(function (c) { filtersEl.appendChild(chip(c.name, c.name, c.links.length)); });

    /* 收藏置顶区 */
    renderPinned();

    /* 普通分类 */
    cats.forEach(function (cat, ci) {
      var links = cat.links.map(function (l, i) { return { link: l, cat: cat.name, idx: i }; })
        .filter(function (e) { return UI.hidden.indexOf(e.link.url) === -1; });

      var actions = mk("span", "sec-actions");
      (function () {
        var bAdd = btn("添加", "ghost", PATH.plus);
        bAdd.addEventListener("click", function () { openLinkModal(cat.name, -1); });
        var bBatch = btn("批量", "ghost", PATH.download);
        bBatch.addEventListener("click", function () { openBatchModal(cat.name); });
        var bRename = btn("重命名", "ghost", PATH.edit);
        bRename.addEventListener("click", function () { openCatModal(ci); });
        var bRemove = btn("删除", "ghost danger", PATH.trash);
        bRemove.addEventListener("click", function () {
          askConfirm("删除分类", "删除「" + cat.name + "」及其 " + cat.links.length + " 个站点？", "删除", function () {
            pushHistory("删除分类「" + cat.name + "」");
            DATA.categories.splice(ci, 1);
            if (activeCat === cat.name) activeCat = "all";
            persist(); render(); updateDirtyBar();
            toast("已删除分类「" + cat.name + "」");
          });
        });
        actions.appendChild(bAdd); actions.appendChild(bBatch);
        actions.appendChild(bRename); actions.appendChild(bRemove);
      })();

      var built = buildSection({ cat: cat.name, title: cat.name, links: links, actions: actions });
      mainEl.appendChild(built.sec);
      animateSection(built.grid, ci);
    });

    /* 收藏区若与搜索/筛选冲突，交给 applyFilter 处理 */

    $("footCount").textContent = "共 " + totalAll + " 个站点，分 " + cats.length + " 类" +
      (UI.starred.length ? " · 已收藏 " + UI.starred.length + " 个" : "");
    renderStats(totalAll, cats.length);

    if (activeCat !== "all" && !cats.some(function (c) { return c.name === activeCat; })) activeCat = "all";
    Array.prototype.forEach.call(filtersEl.children, function (c) {
      c.setAttribute("aria-pressed", String(c.dataset.value === activeCat));
    });

    if (pendingSec) {
      var target = document.getElementById("c-" + pendingSec) || document.getElementById("c-" + pendingSec.replace(/\s/g, ""));
      if (target) requestAnimationFrame(function () {
        target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      });
      pendingSec = null;
    }
    syncDraggable();
    applyFilter();
  }

  function renderPinned() {
    var old = document.getElementById("c-" + pinnedCat);
    if (old) old.remove();
    /* 只保留仍存在的收藏，顺便清理失效项 */
    var valid = [];
    UI.starred.forEach(function (u) {
      var found = false;
      DATA.categories.forEach(function (c) { c.links.forEach(function (l) { if (l.url === u) found = true; }); });
      if (found) valid.push(u);
    });
    if (valid.length !== UI.starred.length) { UI.starred = valid; saveUI(); }

    var entries = collectByUrls(valid);
    var sec = buildSection({
      cat: pinnedCat, id: "c-" + pinnedCat, title: "常用",
      links: entries.map(function (e) { return { link: e.link, cat: e.cat, idx: -1, virtual: true }; }),
      pinned: true
    });
    sec.sec.dataset.pinned = "1";
    sec.sec.style.display = entries.length ? "" : "none";
    mainEl.insertBefore(sec.sec, mainEl.firstChild);
    animateSection(sec.grid, -1);
    /* 收藏卡片不进 cards（不参与搜索筛选），但要能被 CSS 计数跳过 */
    cards = cards.filter(function (c) { return c.cat !== pinnedCat; });
  }

  /* Hero 进场编排。
     注意：hero 的标题/副标题/统计都带 .reveal（初始 opacity:0），
     必须有人在合适时机加 .in，否则整块内容永远不可见。 */
  function revealHero() {
    var els = document.querySelectorAll(".hero .reveal");
    if (reduceMotion) {
      els.forEach(function (el) { el.classList.add("in"); });
      return;
    }
    els.forEach(function (el, i) {
      setTimeout(function () { el.classList.add("in"); }, 70 + i * 105);
    });
  }

  /* 通用兜底：任何带 .reveal 却迟迟没拿到 .in 的元素，一律强制显示。
     宁可牺牲动画，也绝不让内容不可见 —— 这类故障肉眼极难发现。
     单次定时器不够：若分组渲染晚于兜底时刻，就再没人救它。
     因此用 MutationObserver 持续守望，新出现的 .reveal 也会被纳入。 */
  function forceRevealAll() {
    document.querySelectorAll(".reveal:not(.in)").forEach(function (el) { el.classList.add("in"); });
  }
  /* 多次兜底 + 轻量轮询。
     不用 MutationObserver：它只在 DOM 变化时触发，而「元素已存在但丢了 .in」
     这种状态变化它看不到。轮询虽朴素，但真能兜住。
     只救「已经在视口附近却仍不可见」的元素，避免抢掉正常的滚动进场动画。 */
  function healReveal() {
    document.querySelectorAll(".reveal:not(.in)").forEach(function (el) {
      var r = el.getBoundingClientRect();
      if (r.top < window.innerHeight * 1.2) el.classList.add("in");
    });
  }
  setTimeout(healReveal, 1500);
  window.addEventListener("load", function () { setTimeout(healReveal, 700); });
  [2.5, 4, 6, 9, 13].forEach(function (t) { setTimeout(healReveal, t * 1000); });
  document.addEventListener("visibilitychange", healReveal);
  window.addEventListener("resize", healReveal);

  function animateSection(grid, ci) {
    if (reduceMotion) {
      grid.querySelectorAll(".card").forEach(function (c) { c.classList.add("in"); });
      return;
    }
    grid.querySelectorAll(".card").forEach(function (c, i) {
      setTimeout(function () { c.classList.add("in"); }, Math.max(0, 40 + ci * 40) + Math.min(i * 22, 260));
    });
    var sec = grid.closest("section");
    if (secObserver && sec) secObserver.observe(sec); else if (sec) sec.classList.add("in");
  }

  function renderStats(total, cats) {
    var s = $("stats");
    s.innerHTML = '<div class="item"><b>0</b><span class="lbl">个站点</span></div>' +
                  '<div class="item"><b>0</b><span class="lbl">个分类</span></div>' +
                  (UI.starred.length ? '<div class="item"><b>0</b><span class="lbl">个收藏</span></div>' : "");
    var bs = s.querySelectorAll("b");
    var vals = UI.starred.length ? [total, cats, UI.starred.length] : [total, cats];
    if (reduceMotion) { bs.forEach(function (b, i) { b.textContent = vals[i]; }); return; }
    vals.forEach(function (target, idx) {
      var node = bs[idx]; if (!node) return;
      var start = performance.now(), dur = 780;
      setTimeout(function tick(now) {
        var p = Math.min(((now || performance.now()) - start) / dur, 1);
        node.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
        if (p < 1) requestAnimationFrame(tick);
      }, idx * 80);
    });
  }

  /* ══════════════════════════════════════════════════════════════
     筛选 / 搜索（带相关性排序）
     ══════════════════════════════════════════════════════════════ */
  function writeHash(kind, value) {
    try {
      if (!kind || !value) history.replaceState(null, "", location.pathname + location.search);
      else history.replaceState(null, "", "#" + kind + "=" + encodeURIComponent(value));
    } catch (e) {}
  }
  function readHash() {
    var raw = (location.hash || "").slice(1);
    if (!raw) return null;
    if (raw.indexOf("cat=") === 0) return { kind: "cat", value: decodeURIComponent(raw.slice(4)) };
    if (raw.indexOf("sec=") === 0) return { kind: "sec", value: decodeURIComponent(raw.slice(4)) };
    var legacy = decodeURIComponent(raw);
    if (legacy.indexOf("c-") === 0 && legacy.length > 2) return { kind: "cat", value: legacy.slice(2) };
    if (legacy) return { kind: "cat", value: legacy };
    return null;
  }

  function setCat(value) {
    var prev = activeCat;
    activeCat = value;
    /* 切分类会让部分卡片隐藏，键盘焦点必须一并清掉，否则高亮落在不可见元素上 */
    clearKbFocus();
    Array.prototype.forEach.call(filtersEl.children, function (c) {
      c.setAttribute("aria-pressed", String(c.dataset.value === value));
    });
    writeHash(value === "all" ? "" : "cat", value === "all" ? "" : value);
    if (reduceMotion || prev === value) { applyFilter(); return; }

    var first = new Map();
    cards.forEach(function (c) { if (!c.el.classList.contains("hide")) first.set(c.el, c.el.getBoundingClientRect()); });
    applyFilter();
    var moved = [];
    cards.forEach(function (c) {
      if (!first.has(c.el) || c.el.classList.contains("hide")) return;
      var f = first.get(c.el), l = c.el.getBoundingClientRect();
      var dx = f.left - l.left, dy = f.top - l.top;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
      c.el.style.transition = "none";
      c.el.style.transform = "translate(" + dx + "px," + dy + "px)";
      moved.push(c.el);
    });
    requestAnimationFrame(function () {
      moved.forEach(function (el) {
        el.style.transition = "";
        el.classList.add("moving");
        el.style.transform = "";
        setTimeout(function () { el.classList.remove("moving"); }, 400);
      });
    });
  }
  function goCat(value) {
    clearKbFocus();
    activeCat = (value === "all" || cards.some(function (c) { return c.cat === value; })) ? value : "all";
    Array.prototype.forEach.call(filtersEl.children, function (c) {
      c.setAttribute("aria-pressed", String(c.dataset.value === activeCat));
    });
    applyFilter();
  }
  window.addEventListener("hashchange", function () {
    var h = readHash();
    if (!h) { if (activeCat !== "all") goCat("all"); return; }
    if (h.kind === "sec") return;
    goCat(h.value);
  });
  /* 收藏区始终显示（除非搜索词不命中或无收藏） */
  function score(c, q) {
    if (!q) return 0;
    var n = c.name.toLowerCase();
    if (n === q) return 0;
    if (n.indexOf(q) === 0) return 1;
    if (n.indexOf(q) > -1) return 2;
    if (String(c.desc || "").toLowerCase().indexOf(q) > -1) return 3;
    return 4;
  }

  function applyFilter() {
    var q = query.trim().toLowerCase();
    var visible = 0, perCat = {};
    var pin = document.getElementById("c-" + pinnedCat);
    var pinShow = 0;

    cards.forEach(function (c) {
      var okCat = activeCat === "all" || c.cat === activeCat;
      var okQ = !q || c.hay.indexOf(q) !== -1;
      c.el.dataset.match = String(score(c, q));
      var ok = okCat && okQ;
      c.el.classList.toggle("hide", !ok);
      if (ok) { visible++; perCat[c.cat] = (perCat[c.cat] || 0) + 1; }
      c.elName.innerHTML = highlight(c.name, q);
      c.elDesc.innerHTML = highlight(c.desc, q);
      c.el.setAttribute("aria-hidden", ok ? "false" : "true");
    });

    /* 相关性排序：仅在搜索时接管，且不改数据、只改渲染顺序 */
    if (q) {
      Array.prototype.forEach.call(mainEl.querySelectorAll(".grid"), function (grid) {
        var list = Array.prototype.slice.call(grid.querySelectorAll("a.card"));
        list.sort(function (a, b) { return (+a.dataset.match) - (+b.dataset.match); });
        list.forEach(function (n) { grid.appendChild(n); });
      });
    }

    Array.prototype.forEach.call(mainEl.children, function (sec) {
      if (sec.dataset.pinned === "1") return;
      var n = perCat[sec.dataset.cat] || 0;
      sec.classList.toggle("hide", n === 0);
      var meta = sec.querySelector(".meta");
      if (meta) meta.textContent = n + " 个站点";
    });

    /* 收藏区：筛选到某分类时隐藏，搜索时只显示命中的收藏 */
    if (pin) {
      var pinnedCards = pin.querySelectorAll("a.card");
      pinShow = 0;
      Array.prototype.forEach.call(pinnedCards, function (card) {
        var hay = (card.querySelector(".t").textContent + " " + card.getAttribute("href")).toLowerCase();
        var show = !q ? true : hay.indexOf(q) > -1;
        card.classList.toggle("hide", !show);
        if (show) pinShow++;
      });
      pin.style.display = (pinShow > 0 && activeCat === "all") ? "" : "none";
      var m = pin.querySelector(".meta");
      if (m) m.textContent = pinShow + " 个站点";
    }

    emptyEl.classList.toggle("show", visible === 0 && !(pin && pinShowIsVisible(pin)));
    if (emptyEl.classList.contains("show")) {
      var title = $("emptyTitle"), hint = $("emptyHint");
      if (editing) { title.textContent = "这个分类下还没有站点"; hint.textContent = "点右下角「添加站点」或分类标题的「添加」即可加入。"; }
      else if (q) { title.textContent = "没有匹配的站点"; hint.textContent = "换个关键词试试，或清空搜索框查看全部。"; }
      else if (activeCat !== "all") { title.textContent = "「" + activeCat + "」下暂无站点"; hint.textContent = "点上方「全部」查看所有站点。"; }
      else { title.textContent = "还没有任何站点"; hint.textContent = "点右上角「编辑」开始添加。"; }
    }
    searchbox.classList.toggle("has-value", String(q).length > 0);
    updateFilterFade();

    /* 读屏播报：只在结果数真的变化时播报，避免打字过程中噪音 */
    if (q) {
      if (visible !== lastAnnouncedCount) {
        lastAnnouncedCount = visible;
        announce(visible ? "找到 " + visible + " 个站点" : "没有匹配的站点");
      }
    } else {
      lastAnnouncedCount = visible;
    }
  }
  var lastAnnouncedCount = -1;
  function pinShowIsVisible(pin) { return pin && pin.style.display !== "none"; }

  function updateFilterFade() {
    var f = filtersEl, w = $("filtersWrap");
    var canRight = f.scrollWidth - f.clientWidth - f.scrollLeft > 4;
    w.classList.toggle("can-scroll-right", canRight);
    w.classList.toggle("at-start", f.scrollLeft > 4);
  }

  /* ══════════════════════════════════════════════════════════════
     键盘导航
     ══════════════════════════════════════════════════════════════ */
  function visibleCards() { return cards.filter(function (c) { return !c.el.classList.contains("hide"); }); }
  /* 记住被聚焦的元素本身，而不是靠「可见列表 + 索引」反查。
     否则一旦该卡片被筛选隐藏，它已不在可见列表里，高亮就永远清不掉 ——
     会出现"幽灵高亮"和多个 .kb-focus 同时存在。 */
  var kbEl = null;

  function focusCard(i) {
    var list = visibleCards();
    if (!list.length) { clearKbFocus(); return; }
    i = Math.max(0, Math.min(i, list.length - 1));
    if (kbEl && kbEl !== list[i].el) kbEl.classList.remove("kb-focus");
    kbIndex = i;
    var c = list[i];
    if (document.activeElement === qEl) qEl.blur();
    c.el.classList.add("kb-focus");
    kbEl = c.el;
    c.el.scrollIntoView({ block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
    lastTrigger = c.el;
  }
  function clearKbFocus() {
    /* 同时清掉所有残留，防止历史遗留的多个高亮 */
    mainEl.querySelectorAll(".card.kb-focus").forEach(function (el) { el.classList.remove("kb-focus"); });
    kbEl = null;
    kbIndex = -1;
  }
  function openFocused() {
    var list = visibleCards();
    if (kbIndex < 0 || !list[kbIndex]) return;
    var card = list[kbIndex];
    pushRecent(card.url);
    window.open(card.url, "_blank", "noopener");
  }

  function inNavState() {
    var ae = document.activeElement;
    return !modalOpen && (!ae || ae === document.body) && !editing;
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (modalOpen) { closeModal(); return; }
      if (kbIndex > -1) { clearKbFocus(); qEl.blur(); return; }
      if (document.activeElement === qEl) { qEl.value = ""; query = ""; applyFilter(); qEl.blur(); return; }
      if (editing) setEditing(false);
      return;
    }
    if (modalOpen) {
      if (e.key === "Enter" && document.activeElement && document.activeElement.tagName === "INPUT") {
        e.preventDefault();
        var primary = modalBody.querySelector(".modal-foot .btn.primary");
        if (primary) primary.click();
      }
      return;
    }

    /* 卡片键盘导航 —— 必须排在「搜索框优先」之前，
       否则进入导航后焦点若仍在搜索框（↓ 进入时并不会自动失焦），
       方向键会被上面的分支拦掉 */
    if (kbIndex > -1) {
      if (e.key === "ArrowRight") { e.preventDefault(); focusCard(kbIndex + 1); return; }
      if (e.key === "ArrowLeft") { e.preventDefault(); focusCard(kbIndex - 1); return; }
      if (e.key === "ArrowDown") { e.preventDefault(); focusCard(Math.min(kbIndex + 4, 9999)); return; }
      if (e.key === "ArrowUp") {
        e.preventDefault();
        if (kbIndex < 4) { clearKbFocus(); qEl.focus(); } else focusCard(kbIndex - 4);
        return;
      }
      if (e.key === "Enter") { e.preventDefault(); openFocused(); return; }
      if (e.key === "s") { e.preventDefault(); var l = visibleCards()[kbIndex]; if (l) l.el.querySelector(".star").click(); return; }
      return;
    }

    /* 搜索框内：↓ 进入结果列表，↑ 跳到结果末尾，Enter 直接打开首个 */
    if (document.activeElement === qEl) {
      if (e.key === "ArrowDown") { e.preventDefault(); focusCard(0); }
      else if (e.key === "ArrowUp" && query.trim()) { e.preventDefault(); focusCard(9999); }
      else if (e.key === "Enter") { e.preventDefault(); focusCard(0); openFocused(); }
      return;
    }

    /* 全局快捷键 */
    if (e.key === "/") { e.preventDefault(); qEl.focus(); qEl.select(); return; }
    /* Ctrl/Cmd+Z 撤销；Ctrl/Cmd+Shift+Z 也走撤销（不做重做，保持简单） */
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z" && !modalOpen) {
      e.preventDefault(); undo(); return;
    }
    if (inNavState()) {
      var k = e.key.toLowerCase();
      if (k === "g") { e.preventDefault(); openJump(); return; }
      if (k === "t") { e.preventDefault(); $("theme").click(); return; }
      if (k === "e") { e.preventDefault(); setEditing(!editing); return; }
      if (k === "?") { e.preventDefault(); openKbdHelp(); return; }
    }
  });

  /* ══════════════════════════════════════════════════════════════
     搜索输入
     ══════════════════════════════════════════════════════════════ */
  var timer = null;
  qEl.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      var prev = query;
      query = qEl.value;
      if (reduceMotion || prev === query) { clearKbFocus(); applyFilter(); return; }
      var first = new Map();
      cards.forEach(function (c) { first.set(c.el, c.el.getBoundingClientRect()); });
      applyFilter();
      clearKbFocus();
      cards.forEach(function (c) {
        if (c.el.classList.contains("hide")) return;
        var f = first.get(c.el);
        if (!f) return;
        var l = c.el.getBoundingClientRect();
        var dx = f.left - l.left, dy = f.top - l.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
        c.el.style.transition = "none";
        c.el.style.transform = "translate(" + dx + "px," + dy + "px)";
        requestAnimationFrame(function () { c.el.style.transition = ""; c.el.style.transform = ""; });
      });
    }, 85);
  });
  $("clear").addEventListener("click", function () {
    qEl.value = ""; query = ""; clearKbFocus(); applyFilter(); qEl.focus();
  });

  /* ══════════════════════════════════════════════════════════════
     滚动：吸顶、定位条、回到顶部
     ══════════════════════════════════════════════════════════════ */
  var nav = $("nav"), fw = $("filtersWrap"), totop = $("totop"), ticking = false;
  function onScroll() {
    var y = window.scrollY || window.pageYOffset;
    nav.classList.toggle("scrolled", y > 8);
    fw.classList.toggle("scrolled", y > 8);
    totop.classList.toggle("show", y > 460);
    var max = document.documentElement.scrollHeight - window.innerHeight;
    totop.style.setProperty("--progress", (max > 0 ? Math.min(y / max, 1) : 0).toFixed(3));
    updateLocator();
    ticking = false;
  }
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
  }, { passive: true });
  totop.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  });
  if (!reduceMotion) {
    var aurora = document.querySelector(".aurora"), hero = document.querySelector(".hero");
    window.addEventListener("scroll", function () {
      var y = Math.min(window.scrollY, 460);
      if (aurora) aurora.style.transform = "translateY(" + (y * .14) + "px)";
      if (hero) hero.style.opacity = String(Math.max(1 - y / 560, 0));
    }, { passive: true });
  }

  /* 定位条：滚动中显示「当前正在看哪个分组」
     取最接近吸顶线的那一个。只判断「跨越吸顶线」是不够的：
     页面滚到底时，靠后的分组可能整段都在视口内却永远越不过吸顶线，
     那样定位条会一直停在倒数第二个分组。 */
  function updateLocator() {
    var loc = $("locator");
    if (editing) { loc.classList.remove("show"); return; }

    var LINE = 110;
    var cur = null, bestDist = Infinity;
    Array.prototype.forEach.call(mainEl.querySelectorAll("section:not(.hide)"), function (s) {
      var r = s.getBoundingClientRect();
      if (r.height === 0) return;                 /* 空分组不参与 */
      if (r.top > window.innerHeight) return;     /* 还没出现在视口里 */
      if (r.bottom <= LINE) return;               /* 已经完全滚过吸顶线 */
      var dist = Math.abs(r.top - LINE);
      if (dist < bestDist) { bestDist = dist; cur = s; }
    });

    if (!cur) { loc.classList.remove("show"); return; }
    $("locatorText").textContent = cur.dataset.cat === pinnedCat ? "常用" : cur.dataset.cat;
    loc.classList.add("show");
  }

  /* 分类跳转面板 */
  function openJump() {
    var panel = $("jumpPanel");
    panel.innerHTML = "";
    var pinnedEntries = collectByUrls(UI.starred);
    if (pinnedEntries.length) {
      panel.appendChild(jumpItem("常用（收藏）", pinnedCat, pinnedEntries.length));
    }
    DATA.categories.forEach(function (c, i) {
      var n = c.links.filter(function (l) { return UI.hidden.indexOf(l.url) === -1; }).length;
      panel.appendChild(jumpItem(c.name, c.name, n));
    });
    $("jump").classList.add("show");
  }
  function jumpItem(label, value, count) {
    var b = mk("button", "jump-item" + (value === activeCat ? " cur" : ""));
    b.type = "button";
    b.appendChild(mk("span", null, label));
    b.appendChild(mk("span", "cnt", String(count)));
    b.addEventListener("click", function () {
      closeJump();
      var id = value === pinnedCat ? "c-" + pinnedCat : "c-" + value;
      var target = document.getElementById(id);
      if (!target) return;
      if (value !== pinnedCat) setCat(value);
      requestAnimationFrame(function () {
        target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
      });
    });
    return b;
  }
  function closeJump() { $("jump").classList.remove("show"); }
  $("jump").addEventListener("click", function (e) { if (e.target === $("jump")) closeJump(); });
  $("locator").addEventListener("click", openJump);
  $("kbdHelp").addEventListener("click", openKbdHelp);

  /* ══════════════════════════════════════════════════════════════
     视图切换
     ══════════════════════════════════════════════════════════════ */
  var VIEWS = ["list", "grid", "cozy"];
  var VIEW_LABEL = { list: "紧凑列表", grid: "标准网格", cozy: "舒展" };
  function setView(v) {
    if (VIEWS.indexOf(v) === -1) v = "grid";
    UI.view = v; saveUI();
    document.body.classList.toggle("view-list", v === "list");
    document.body.classList.toggle("view-cozy", v === "cozy");
    VIEWS.forEach(function (k) {
      var btn = $("view" + k.charAt(0).toUpperCase() + k.slice(1));
      if (btn) btn.setAttribute("aria-pressed", String(v === k));
    });
  }
  VIEWS.forEach(function (k) {
    var btn = $("view" + k.charAt(0).toUpperCase() + k.slice(1));
    if (btn) btn.addEventListener("click", function () { setView(k); announce("视图：" + VIEW_LABEL[k]); });
  });
  $("undoBtn").addEventListener("click", undo);

  /* ══════════════════════════════════════════════════════════════
     编辑模式
     ══════════════════════════════════════════════════════════════ */
  function setEditing(on) {
    if (on === editing) return;
    editing = on;
    document.body.classList.toggle("editing", on);
    $("editToggle").setAttribute("aria-pressed", String(on));
    $("filtersWrap").style.display = on ? "none" : "";
    if (on) {
      activeCat = "all"; writeHash("", "");
      clearKbFocus(); applyFilter(); syncDraggable(); updateLocator();
      toast("编辑模式：可新增、修改、拖拽排序");
    } else {
      render();
      toast("已退出编辑");
    }
  }
  $("editToggle").addEventListener("click", function () { setEditing(!editing); });

  /* 悬浮「添加站点」：先问加到哪个分类 */
  $("fab").addEventListener("click", function () {
    openModal("添加到哪个分类？", function (body, foot) {
      DATA.categories.forEach(function (c) {
        var b = mk("button", "jump-item");
        b.type = "button";
        b.appendChild(mk("span", null, c.name));
        b.appendChild(mk("span", "cnt", c.links.length + " 个"));
        b.addEventListener("click", function () { closeModal(); setTimeout(function () { openLinkModal(c.name, -1); }, 60); });
        body.appendChild(b);
      });
      var nb = btn("新建分类", "primary", PATH.plus);
      nb.addEventListener("click", function () { closeModal(); setTimeout(function () { openCatModal(-1); }, 60); });
      foot.appendChild(nb);
      var bb = btn("批量导入当前首个分类", "ghost", PATH.download);
      bb.style.display = DATA.categories.length ? "" : "none";
      bb.addEventListener("click", function () {
        closeModal();
        setTimeout(function () { openBatchModal(DATA.categories[0].name); }, 60);
      });
      foot.insertBefore(bb, nb);
    });
  });

  /* 顶部提示条 */
  function updateDirtyBar() {
    var has = document.body.classList.contains("has-local");
    if (!has) return;
    var t = $("dirtyText");
    t.innerHTML = GH.token
      ? "本机改动尚未提交到 GitHub。点「提交到 GitHub」即写回仓库，之后所有设备可见。"
      : "当前显示的是<strong>本机编辑</strong>的内容，仅保存在这台设备。连接 GitHub 后可一键提交到线上。";
    $("btnPushText").textContent = GH.token ? "提交到 GitHub" : "连接 GitHub";
  }
  $("btnPush").addEventListener("click", function () { pushToGitHub(); });

  /* ══════════════════════════════════════════════════════════════
     导入：从 links.json 恢复数据与收藏（换设备时用）
     ══════════════════════════════════════════════════════════════ */
  function applyImport(obj) {
    if (!obj || !Array.isArray(obj.categories)) throw new Error("文件格式不对：缺少 categories 数组");
    var bad = obj.categories.filter(function (c) { return !c || typeof c.name !== "string" || !Array.isArray(c.links); });
    if (bad.length) throw new Error("有 " + bad.length + " 个分类缺少 name 或 links 字段");
    var cnt = obj.categories.reduce(function (a, c) { return a + c.links.length; }, 0);
    pushHistory("导入数据");
    DATA = {
      title: obj.title || "壹页",
      subtitle: obj.subtitle || "",
      categories: obj.categories
    };
    if (Array.isArray(obj.starred)) { UI.starred = obj.starred.slice(); saveUI(); }
    persist(); render(); updateDirtyBar();
    toast("已导入 " + cnt + " 个站点" + (Array.isArray(obj.starred) ? "、" + obj.starred.length + " 个收藏" : ""));
    announce("已导入 " + cnt + " 个站点");
  }
  function openImportModal() {
    openModal("导入 links.json", function (body, foot) {
      body.appendChild(modalNote(
        "用于换设备：把导出的 <code>links.json</code> 导进来，站点与收藏一并恢复。<br>" +
        "导入后会覆盖当前内容（可用「撤销」回退）。"));
      var fileBtn = mk("label", "btn");
      fileBtn.style.cursor = "pointer";
      fileBtn.appendChild(svgIcon(PATH.upload));
      fileBtn.appendChild(mk("span", null, "选择文件"));
      var fi = mk("input");
      fi.type = "file"; fi.accept = ".json,application/json";
      fi.style.display = "none";
      fileBtn.setAttribute("for", "importFile");
      fi.id = "importFile";
      body.appendChild(fileBtn);
      body.appendChild(fi);

      var f = mk("div", "field");
      f.style.marginTop = "14px";
      f.appendChild(mk("label", null, "或直接粘贴 JSON 内容"));
      var ta = mk("textarea");
      ta.rows = 7;
      ta.style.cssText = "width:100%;padding:10px 12px;background:var(--card);border:1px solid var(--line);" +
                         "border-radius:9px;outline:none;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px";
      ta.placeholder = '{ "title": "壹页", "categories": [ ... ] }';
      f.appendChild(ta);
      body.appendChild(f);
      var err = mk("div", "hint");
      err.style.color = "var(--danger)";
      body.appendChild(err);

      function doImport(text) {
        err.textContent = "";
        try {
          applyImport(JSON.parse(text));
          closeModal();
        } catch (e) {
          err.textContent = "导入失败：" + (e.message || "内容不是合法 JSON");
        }
      }
      fi.addEventListener("change", function () {
        var file = fi.files && fi.files[0];
        if (!file) return;
        var r = new FileReader();
        r.onload = function () { doImport(String(r.result)); };
        r.onerror = function () { err.textContent = "读取文件失败"; };
        r.readAsText(file, "utf-8");
      });
      var okb = btn("导入", "primary", PATH.download);
      okb.addEventListener("click", function () { doImport(ta.value); });
      foot.appendChild(okb);
    }, { wide: true });
  }

  /* ══════════════════════════════════════════════════════════════
     首次访问引导（只显示一次，之后不再打扰）
     ══════════════════════════════════════════════════════════════ */
  var K_SEEN = "links-seen-v1";
  function maybeOnboard() {
    if (safeGet(localStorage, K_SEEN)) return;
    $("onboardText").innerHTML =
      "按 <kbd>/</kbd> 搜索 · 方向键浏览 · <b>卡片右上角星标</b>可收藏置顶 · " +
      "点右上角<b>「编辑」</b>可增删改 · 连上 GitHub 后能一键提交到线上";
    $("onboard").classList.add("show");
  }
  $("onboardClose").addEventListener("click", function () {
    safeSet(localStorage, K_SEEN, "1");
    $("onboard").classList.remove("show");
  });

  /* ══════════════════════════════════════════════════════════════
     离线可用：Service Worker（仅 http(s)，本地 file:// 不注册）
     ══════════════════════════════════════════════════════════════ */
  function registerSW() {
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "http:" && location.protocol !== "https:") return;
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {
        /* 注册失败不影响正常使用（例如某些隐私模式） */
      });
    });
  }

  /* ══════════════════════════════════════════════════════════════
     导出 / 恢复
     ══════════════════════════════════════════════════════════════ */
  function exportPayload() {
    /* 收藏与隐藏随导出一起走，换设备后偏好不丢 */
    var out = { title: DATA.title, subtitle: DATA.subtitle, categories: DATA.categories };
    if (UI.starred.length) out.starred = UI.starred;
    return out;
  }
  function exportJSON() {
    var blob = new Blob([JSON.stringify(exportPayload(), null, 2) + "\n"], { type: "application/json;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = mk("a"); a.href = url; a.download = "links.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 3000);
    toast(UI.starred.length ? "已导出（含 " + UI.starred.length + " 个收藏）" : "已导出 links.json");
  }
  $("btnExport2").addEventListener("click", exportJSON);
  $("btnImport").addEventListener("click", openImportModal);
  $("btnReset2").addEventListener("click", function () {
    askConfirm("恢复线上版本", "将丢弃本机的编辑内容与偏好设置，恢复为线上 links.json。", "恢复", function () {
      dropLocal();
      UI = { starred: [], recent: [], view: UI.view, hidden: [] };
      DATA = clone(BASE);
      activeCat = "all";
      render(); updateDirtyBar();
      toast("已恢复线上版本");
    });
  });

  /* ══════════════════════════════════════════════════════════════
     拖拽排序（鼠标）。触屏用卡片上的上/下移按钮。
     ══════════════════════════════════════════════════════════════ */
  var dragCard = null, dragSec = null;
  function syncDraggable() {
    mainEl.querySelectorAll("a.card").forEach(function (c) { c.draggable = editing && !isTouch(); });
    mainEl.querySelectorAll("section").forEach(function (s) { s.draggable = editing && !isTouch(); });
    document.body.classList.toggle("on-touch", editing && isTouch());
  }
  function clearDropMarks() {
    mainEl.querySelectorAll(".drop-before,.drop-after").forEach(function (n) { n.classList.remove("drop-before", "drop-after"); });
    mainEl.querySelectorAll("section.drop-target").forEach(function (s) { s.classList.remove("drop-target"); });
  }
  mainEl.addEventListener("dragstart", function (e) {
    if (!editing) { e.preventDefault(); return; }
    var card = e.target.closest("a.card"), sec = e.target.closest("section");
    if (card) { dragCard = card; card.classList.add("dragging"); }
    else if (sec) { dragSec = sec; sec.classList.add("dragging"); }
  });
  mainEl.addEventListener("dragend", function () {
    if (dragCard) dragCard.classList.remove("dragging");
    if (dragSec) dragSec.classList.remove("dragging");
    clearDropMarks();
    dragCard = null; dragSec = null;
  });
  mainEl.addEventListener("dragover", function (e) {
    if (!editing) return;
    e.preventDefault();
    var t = e.target.closest("a.card");
    if (dragCard && t && t !== dragCard) {
      clearDropMarks();
      var r = t.getBoundingClientRect();
      t.classList.add(e.clientX < r.left + r.width / 2 ? "drop-before" : "drop-after");
      return;
    }
    var s = e.target.closest("section");
    if (dragSec && s && s !== dragSec && s.dataset.pinned !== "1") {
      clearDropMarks();
      s.classList.add("drop-target");
    }
  });
  mainEl.addEventListener("drop", function (e) {
    if (!editing) return;
    e.preventDefault();
    if (dragSec) {
      var targetSec = e.target.closest("section");
      if (targetSec && targetSec !== dragSec && targetSec.dataset.pinned !== "1") {
        var names = DATA.categories.map(function (c) { return c.name; });
        var from = names.indexOf(dragSec.dataset.cat), to = names.indexOf(targetSec.dataset.cat);
        if (from > -1 && to > -1) {
          pushHistory("调整「" + DATA.categories[from].name + "」位置");
          var moved = DATA.categories.splice(from, 1)[0];
          DATA.categories.splice(to, 0, moved);
          persist(); render(); updateDirtyBar();
          toast("已调整「" + moved.name + "」的位置");
        }
      }
      return;
    }
    var t = e.target.closest("a.card");
    if (!dragCard || !t || t === dragCard) return;
    var fromGrid = dragCard.closest(".grid"), toGrid = t.closest(".grid");
    if (!fromGrid || !toGrid) return;
    var fromCat = catByName(fromGrid.dataset.cat), toCat = catByName(toGrid.dataset.cat);
    if (!fromCat || !toCat) return;
    var fromIdx = Array.prototype.indexOf.call(fromGrid.querySelectorAll("a.card"), dragCard);
    var toIdx = Array.prototype.indexOf.call(toGrid.querySelectorAll("a.card"), t);
    if (fromIdx < 0 || toIdx < 0) return;
    var rect = t.getBoundingClientRect();
    var after = e.clientX >= rect.left + rect.width / 2;
    pushHistory("移动「" + (fromCat.links[fromIdx].name || "") + "」");
    var movedLink = fromCat.links.splice(fromIdx, 1)[0];
    var insertAt = toIdx + (after ? 1 : 0);
    if (fromCat === toCat && fromIdx < insertAt) insertAt--;
    toCat.links.splice(Math.max(insertAt, 0), 0, movedLink);
    persist(); render(); updateDirtyBar();
    toast("已移动「" + (movedLink.name || movedLink.url) + "」");
  });

  /* ══════════════════════════════════════════════════════════════
     启动
     ══════════════════════════════════════════════════════════════ */
  (function initHash() {
    var h = readHash();
    if (!h) return;
    if (h.kind === "sec") pendingSec = h.value;
    else if (h.value) activeCat = h.value;
  })();

  loadUI();
  loadGH();
  setView(UI.view);
  revealHero();
  maybeOnboard();
  registerSW();
  updateUndoBtn();
  updateGhBadge();
  document.body.classList.toggle("has-local", !!loadLocal());

  /* 滚动时更新筛选条渐隐 */
  filtersEl.addEventListener("scroll", updateFilterFade, { passive: true });
  window.addEventListener("resize", function () { updateFilterFade(); syncDraggable(); });
  window.addEventListener("beforeunload", saveIconCache);

  function applyData(base) {
    BASE = clone(base);
    if (base.repo) REPO = Object.assign(clone(DEFAULT_REPO), base.repo);
    AUTH = base.auth || null;
    var local = loadLocal();
    if (local) {
      DATA = local;
      document.body.classList.add("has-local");
    } else {
      DATA = clone(base);
      document.body.classList.remove("has-local");
    }
    if (Array.isArray(base.starred)) {
      /* 线上带了收藏定义时合并进本机偏好（并集） */
      base.starred.forEach(function (u) { if (UI.starred.indexOf(u) === -1) UI.starred.push(u); });
      saveUI();
    }
    render();
    updateDirtyBar();
  }

  /* OAuth 回调优先处理（会清掉 URL 里的 code） */
  Promise.resolve()
    .then(handleOAuthCallback)
    .catch(function () { /* 授权流程出错不应阻断页面加载 */ })
    .then(function () { return fetch("links.json", { cache: "no-cache" }); })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (json) {
        applyData((json && Array.isArray(json.categories)) ? json : { title: "壹页", subtitle: "", categories: [] });
      })
      .catch(function (err) {
        var local = loadLocal();
        if (local) {
          DATA = local;
          document.body.classList.add("has-local");
          render(); updateDirtyBar();
          toast("线上数据读取失败，正在显示本机编辑内容", "err");
          return;
        }
        var skel = $("skeleton");
        if (skel) skel.remove();
        mainEl.innerHTML = '<div class="empty show" style="display:block">' +
          '<h3>数据加载失败</h3><p>无法读取 <code>links.json</code>（' + esc(err.message) + '）。<br>' +
          '若你是直接双击打开 HTML 文件，请改用本地服务器预览；也可以点右上角「编辑」从零添加站点。</p></div>';
      });

  /* 供自动化测试使用 */
  window.__page = {
    get data() { return DATA; },
    get base() { return BASE; },
    get ui() { return UI; },
    get editing() { return editing; },
    get gh() { return GH; },
    get repo() { return REPO; },
    exportText: function () { return JSON.stringify(exportPayload(), null, 2); },
    setEditing: setEditing,
    setToken: function (t, login, method) { GH = { token: t, login: login || "", method: method || "pat" }; saveGH(); updateGhBadge(); },
    push: pushToGitHub
  };

  /* 自动化测试与排障用的额外钩子，与上面的只读接口分开，避免污染正常 API */
  window.__pageTest = {
    get kbIndex() { return kbIndex; },
    focusCard: focusCard,
    openJump: openJump,
    openGhModal: openGhModal,
    statsCount: function () { return document.querySelectorAll("#stats .item").length; },
    locatorText: function () { return $("locatorText").textContent; },
    updateLocator: updateLocator
  };
})();

</script>
</body>
</html>
