<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>常用网址</title>
<meta name="description" content="把每天要打开的站点放在一处">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
<style>
  /* ══════════════════════════════════════════════════════════
     设计令牌
     暗色不用纯黑：改用分层灰阶，靠"卡片比页面亮一档 + 描边"
     建立层次。纯黑会让卡片无处依附，也就成了"黑框"。
     ══════════════════════════════════════════════════════════ */
  :root {
    /* 表面层级：页面 → 卡片 → 悬停 */
    --bg:            #f5f5f7;
    --bg-deep:       #ececee;
    --card:          #ffffff;
    --card-hover:    #ffffff;
    --nav-bg:        rgba(245, 245, 247, .76);

    /* 描边：可见但不抢戏 */
    --line:          rgba(0, 0, 0, .07);
    --line-strong:   rgba(0, 0, 0, .13);

    /* 文字：全部通过 WCAG AA */
    --t1:            #1d1d1f;   /* 标题 16.8:1 */
    --t2:            #5f5f66;   /* 描述 6.3:1 */
    --t3:            #86868b;   /* 弱化 3.6:1（仅用于极小字号装饰） */

    --accent:        #0071e3;
    --accent-ink:    #0058b0;
    --accent-soft:   rgba(0, 113, 227, .09);

    /* 头像底：浅色恒定，因为绝大多数品牌 logo 为深色/彩色 */
    --avatar-bg:     #f2f2f4;
    --avatar-ring:   rgba(0, 0, 0, .06);

    --sh-1: 0 1px 1px rgba(0,0,0,.03), 0 2px 6px rgba(0,0,0,.04);
    --sh-2: 0 2px 4px rgba(0,0,0,.04), 0 10px 26px rgba(0,0,0,.09);
    --sh-3: 0 10px 40px rgba(0,0,0,.13);
    --spot: radial-gradient(280px circle at var(--mx,50%) var(--my,50%), rgba(0,113,227,.07), transparent 62%);

    --r-card: 17px;
    --r-pill: 980px;
    --maxw:   1280px;

    /* 动效曲线：出场用减速，回弹用轻微过冲 */
    --e-out:    cubic-bezier(.22, 1, .36, 1);
    --e-inout:  cubic-bezier(.65, 0, .35, 1);
    --e-spring: cubic-bezier(.34, 1.4, .5, 1);
    --fast: .18s;
    --mid:  .32s;
    --slow: .6s;
  }
  html[data-theme="dark"] {
    --bg:            #0b0b0d;
    --bg-deep:       #060608;
    --card:          #17171b;
    --card-hover:    #1e1e23;
    --nav-bg:        rgba(11, 11, 13, .74);

    --line:          rgba(255, 255, 255, .085);
    --line-strong:   rgba(255, 255, 255, .17);

    --t1:            #f2f2f5;   /* 16.2:1 */
    --t2:            #a6a6ad;   /* 7.5:1 */
    --t3:            #83838a;   /* 4.0:1 */

    --accent:        #3d9bff;
    --accent-ink:    #8dc0ff;
    --accent-soft:   rgba(61, 155, 255, .13);

    --avatar-bg:     #f2f2f4;
    --avatar-ring:   rgba(255, 255, 255, .10);

    --sh-1: 0 1px 2px rgba(0,0,0,.4);
    --sh-2: 0 4px 10px rgba(0,0,0,.5), 0 12px 32px rgba(0,0,0,.4);
    --sh-3: 0 12px 44px rgba(0,0,0,.65);
    --spot: radial-gradient(280px circle at var(--mx,50%) var(--my,50%), rgba(61,155,255,.10), transparent 62%);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--t1);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    /* 主题切换时不做全局颜色过渡：会让整个页面"泛一下"，显得钝 */
  }
  ::selection { background: var(--accent-soft); color: var(--t1); }

  ::-webkit-scrollbar { width: 11px; height: 11px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--line-strong);
    border-radius: 10px;
    border: 3px solid var(--bg);
    transition: background var(--fast);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--t3); }

  /* ══════════════════════════════════════════════════════════
     导航
     ══════════════════════════════════════════════════════════ */
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(22px);
    -webkit-backdrop-filter: saturate(180%) blur(22px);
    border-bottom: 1px solid transparent;
    transition: border-color var(--mid) var(--e-out), background var(--mid) var(--e-out);
  }
  .nav.scrolled { border-bottom-color: var(--line); }
  .nav-inner {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 26px;
    height: 54px;
    display: flex; align-items: center; gap: 16px;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-size: 15px; font-weight: 600;
    letter-spacing: -.012em;
    color: var(--t1);
    text-decoration: none;
    white-space: nowrap;
    transition: opacity var(--fast);
  }
  .brand:hover { opacity: .72; }
  .brand-mark {
    width: 22px; height: 22px; flex: none;
    border-radius: 6.5px;
    background: var(--t1);
    position: relative;
    transition: transform .55s var(--e-spring);
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 6.5px;
    border: 2px solid var(--bg);
    border-radius: 50%;
  }
  .brand:hover .brand-mark { transform: rotate(90deg); }

  /* 分类切换统一由下方 chip 承担，顶部导航不再重复列一遍分类 */

  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

  /* 搜索：聚焦时平滑展开，图标同步变色 */
  .search {
    position: relative;
    width: 186px;
    transition: width .42s var(--e-out);
  }
  .search:focus-within { width: 276px; }
  .search svg {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--t3); pointer-events: none;
    transition: color var(--fast) var(--e-out);
  }
  .search:focus-within svg { color: var(--accent); }
  #q {
    width: 100%;
    padding: 8px 30px 8px 32px;
    font: inherit; font-size: 13.5px;
    color: var(--t1);
    background: var(--accent-soft);
    border: 1px solid transparent;
    border-radius: var(--r-pill);
    outline: none;
    transition: background var(--mid) var(--e-out), border-color var(--mid) var(--e-out),
                box-shadow var(--mid) var(--e-out);
  }
  #q::placeholder { color: var(--t3); }
  #q:focus {
    background: var(--card);
    border-color: var(--accent);
    box-shadow: 0 0 0 3.5px var(--accent-soft);
  }
  #q::-webkit-search-cancel-button { display: none; }
  .clear {
    position: absolute; right: 5px; top: 50%;
    width: 22px; height: 22px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 50%;
    color: var(--t3); cursor: pointer; font-size: 15px; line-height: 1;
    /* 垂直居中用 translate 属性，避免与缩放用的 transform 互相覆盖 */
    translate: 0 -50%;
    scale: .7;
    opacity: 0;
    transition: opacity var(--fast) var(--e-out), scale var(--fast) var(--e-spring),
                background var(--fast), color var(--fast);
  }
  .search.has-value .clear { opacity: 1; scale: 1; }
  .clear:hover { background: var(--line-strong); color: var(--t1); }
  .kbd {
    position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--t3);
    padding: 1px 5px;
    border: 1px solid var(--line-strong);
    border-radius: 5px;
    pointer-events: none;
    transition: opacity var(--fast) var(--e-out), transform var(--fast) var(--e-out);
  }
  .search:focus-within .kbd, .search.has-value .kbd { opacity: 0; transform: translateY(-50%) scale(.85); }

  .icon-btn {
    position: relative;
    flex: none;
    width: 34px; height: 34px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 50%;
    color: var(--t2);
    cursor: pointer;
    transition: background var(--fast) var(--e-out), color var(--fast) var(--e-out),
                scale var(--fast) var(--e-spring);
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--t1); }
  .icon-btn:active { scale: .88; }
  /* 图标切换：旋转 + 淡出淡入，而不是硬切 */
  .icon-btn svg {
    position: absolute;
    width: 17px; height: 17px;
    transition: opacity var(--mid) var(--e-out), transform var(--mid) var(--e-spring);
  }
  html[data-theme="dark"] .icon-sun { opacity: 0; transform: rotate(-55deg) scale(.6); }
  html:not([data-theme="dark"]) .icon-moon { opacity: 0; transform: rotate(55deg) scale(.6); }
  html[data-theme="dark"] .icon-moon { opacity: 1; transform: rotate(0) scale(1); }
  html:not([data-theme="dark"]) .icon-sun { opacity: 1; transform: rotate(0) scale(1); }

  /* ══════════════════════════════════════════════════════════
     Hero
     ══════════════════════════════════════════════════════════ */
  .hero {
    position: relative;
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 68px 26px 34px;
    /* 与内容区同为左对齐 —— 一页内混用居中与左对齐会让版面散掉。
       极光是 940px 溢出元素，必须在此裁掉（body 的 overflow-x 挡不住文档被撑宽）。 */
    overflow: hidden;
  }
  /* 左上角极淡的环境光，替代原先铺满整个宽度的居中光斑 */
  .aurora {
    position: absolute;
    left: -140px; top: -230px;
    width: 760px; height: 460px;
    pointer-events: none;
    opacity: .65;
    filter: blur(58px);
    background:
      radial-gradient(circle at 34% 44%, rgba(0,113,227,.34), transparent 52%),
      radial-gradient(circle at 62% 30%, rgba(175,82,222,.24), transparent 54%),
      radial-gradient(circle at 20% 72%, rgba(255,55,95,.14), transparent 56%);
    animation: drift 24s var(--e-inout) infinite alternate;
  }
  html[data-theme="dark"] .aurora { opacity: .5; }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(26px, 22px) scale(1.07); }
    100% { transform: translate(-14px, -12px) scale(1.03); }
  }

  .hero-inner { position: relative; max-width: 640px; }

  .hero h1 {
    margin: 0 0 14px;
    font-size: clamp(34px, 5.4vw, 54px);
    font-weight: 700;
    letter-spacing: -.032em;
    line-height: 1.06;
    background: linear-gradient(180deg, var(--t1) 58%, color-mix(in srgb, var(--t1) 68%, transparent));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero .sub {
    margin: 0 0 30px;
    font-size: clamp(15.5px, 1.7vw, 18px);
    line-height: 1.55;
    color: var(--t2);
    letter-spacing: -.008em;
  }
  /* 统计不再挤成一行数字：改成三个有语义的数据块 */
  .stats { display: flex; gap: 0; }
  .stats .item {
    display: flex; flex-direction: column; gap: 3px;
    padding-right: 26px;
  }
  .stats .item + .item {
    padding-left: 26px;
    border-left: 1px solid var(--line);
  }
  .stats b {
    font-size: 21px; font-weight: 640;
    line-height: 1;
    color: var(--t1);
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .stats .lbl {
    font-size: 12.5px;
    color: var(--t3);
    letter-spacing: .01em;
  }

  /* ══════════════════════════════════════════════════════════
     筛选
     ══════════════════════════════════════════════════════════ */
  .filters-wrap {
    position: sticky; top: 54px; z-index: 90;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(22px);
    -webkit-backdrop-filter: saturate(180%) blur(22px);
    border-bottom: 1px solid transparent;
    transition: border-color var(--mid) var(--e-out);
  }
  .filters-wrap.scrolled { border-bottom-color: var(--line); }
  .filters {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 12px 26px;
    display: flex; gap: 7px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px;
    font: inherit; font-size: 13.5px; font-weight: 500;
    color: var(--t2);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-pill);
    cursor: pointer;
    white-space: nowrap;
    text-decoration: none;   /* 已改为 <a>，去掉下划线 */
    /* hash 锚点滚动时避开吸顶的导航与筛选条 */
    scroll-margin-top: 120px;
    transition: color var(--fast) var(--e-out), background var(--fast) var(--e-out),
                border-color var(--fast) var(--e-out), box-shadow var(--fast) var(--e-out),
                transform var(--fast) var(--e-spring);
  }
  .chip:hover {
    color: var(--t1);
    border-color: var(--line-strong);
    box-shadow: var(--sh-1);
    transform: translateY(-1.5px);
  }
  .chip:active { transform: translateY(0) scale(.965); }
  .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .chip[aria-pressed="true"] {
    color: #fff;
    background: var(--t1);
    border-color: var(--t1);
    box-shadow: 0 2px 10px color-mix(in srgb, var(--t1) 22%, transparent);
  }
  html[data-theme="dark"] .chip[aria-pressed="true"] { color: #0b0b0d; }
  .chip .n {
    font-size: 11.5px; opacity: .55;
    font-variant-numeric: tabular-nums;
  }
  .chip[aria-pressed="true"] .n { opacity: .7; }

  /* ══════════════════════════════════════════════════════════
     内容
     ══════════════════════════════════════════════════════════ */
  main {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 44px 26px 96px;
  }
  section { margin-bottom: 54px; }
  section.hide { display: none; }

  .sec-head {
    display: flex; align-items: baseline; gap: 11px;
    margin: 0 0 19px;
  }
  .sec-head h2 {
    margin: 0;
    font-size: 21px;
    font-weight: 640;
    letter-spacing: -.022em;
    color: var(--t1);
  }
  .sec-head .meta {
    font-size: 13px;
    color: var(--t3);
    font-variant-numeric: tabular-nums;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
    gap: 13px;
  }

  /* ── 卡片 ───────────────────────────────────────────────── */
  .card {
    position: relative;
    display: flex; align-items: center; gap: 13px;
    padding: 14px 16px 14px 14px;
    min-width: 0;
    color: inherit;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--r-card);
    box-shadow: var(--sh-1);
    overflow: hidden;
    opacity: 0;
    transform: translateY(16px) scale(.985);
    transition:
      opacity .5s var(--e-out),
      transform .5s var(--e-out),
      box-shadow .3s var(--e-out),
      border-color .3s var(--e-out),
      background .3s var(--e-out);
  }
  .card.in { opacity: 1; transform: translateY(0) scale(1); }
  .card.hide { display: none; }

  /* 跟随指针的柔光 */
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: var(--spot);
    opacity: 0;
    transition: opacity .3s var(--e-out);
    pointer-events: none;
  }
  .card:hover::before { opacity: 1; }

  .card:hover {
    transform: translateY(-3px) scale(1.006);
    background: var(--card-hover);
    border-color: var(--line-strong);
    box-shadow: var(--sh-2);
  }
  .card:active { transform: translateY(-1px) scale(.998); transition-duration: .07s; }
  .card:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3.5px var(--accent-soft);
  }

  /* 头像：恒定浅底 + 图标投影轮廓
     浅底让深色/彩色 logo 清晰；极少数纯白 logo（Reddit 等）
     靠一圈极淡投影勾出边界，不牺牲品牌原色，也不用土气的中灰底。 */
  .avatar {
    position: relative;
    flex: none;
    width: 38px; height: 38px;
    border-radius: 10.5px;
    display: grid; place-items: center;
    background: var(--avatar-bg);
    box-shadow: inset 0 0 0 1px var(--avatar-ring);
    overflow: hidden;
    transition: transform .38s var(--e-spring);
  }
  .card:hover .avatar { transform: scale(1.07) rotate(-2.5deg); }
  .avatar img {
    width: 22px; height: 22px; display: block;
    /* 白色 logo 在浅底上的形态由这一圈投影补足 */
    filter: drop-shadow(0 0 .6px rgba(0,0,0,.55)) drop-shadow(0 1px 1px rgba(0,0,0,.16));
  }
  .avatar.failed img { display: none; }
  .avatar .fb {
    display: none;
    width: 100%; height: 100%;
    place-items: center;
    font-size: 15px; font-weight: 650;
    color: #fff;
    letter-spacing: -.02em;
  }
  .avatar.failed .fb { display: grid; }

  .info { min-width: 0; flex: 1; }
  .info .t {
    display: block;
    font-size: 15px; font-weight: 560;
    letter-spacing: -.012em;
    color: var(--t1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .info .d {
    display: block;
    margin-top: 3px;
    font-size: 12.5px;
    line-height: 1.4;
    color: var(--t2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .arrow {
    flex: none;
    width: 15px; height: 15px;
    color: var(--t3);
    opacity: 0;
    transform: translateX(-6px);
    transition: opacity .28s var(--e-out), transform .28s var(--e-out), color .28s;
  }
  .card:hover .arrow { opacity: 1; transform: translateX(0); color: var(--accent); }

  mark {
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-radius: 3px;
    padding: 0 1.5px;
  }

  /* ── 筛选时的重排：用 FLIP 做平滑移动 ─────────────────── */
  .card.moving { transition: transform .34s var(--e-out), opacity .34s var(--e-out); }

  /* ── 空状态 ─────────────────────────────────────────────── */
  .empty { display: none; padding: 96px 20px; text-align: center; }
  .empty.show { display: block; animation: pop .45s var(--e-out) both; }
  .empty svg { width: 40px; height: 40px; color: var(--t3); opacity: .45; margin-bottom: 16px; }
  .empty h3 { margin: 0 0 7px; font-size: 17.5px; font-weight: 620; color: var(--t1); }
  .empty p { margin: 0; color: var(--t2); font-size: 14px; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px) scale(.985); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── 回到顶部：带环形进度 ───────────────────────────────── */
  .totop {
    position: fixed;
    right: 28px; bottom: 28px;
    z-index: 95;
    width: 44px; height: 44px;
    display: grid; place-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 50%;
    box-shadow: var(--sh-2);
    color: var(--t2);
    cursor: pointer;
    opacity: 0; visibility: hidden;
    transform: translateY(14px) scale(.86);
    transition: opacity .34s var(--e-out), transform .34s var(--e-spring),
                visibility .34s, color var(--fast) var(--e-out), box-shadow var(--fast);
  }
  .totop.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
  .totop:hover { color: var(--accent); box-shadow: var(--sh-3); transform: translateY(-3px) scale(1.06); }
  .totop:active { transform: translateY(-1px) scale(.97); }
  .totop svg.arrowup { width: 16px; height: 16px; }
  .totop svg.ring { position: absolute; inset: -1px; width: 46px; height: 46px; transform: rotate(-90deg); }
  .totop .ring circle {
    fill: none; stroke: var(--accent); stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 138.2;
    stroke-dashoffset: calc(138.2 - 138.2 * var(--progress, 0));
    opacity: .9;
    transition: stroke-dashoffset .1s linear;
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 28px 26px;
    max-width: var(--maxw);
    margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--t3);
  }
  footer a { color: var(--t2); text-decoration: none; transition: color var(--fast); }
  footer a:hover { color: var(--accent); }

  /* ── 骨架 ───────────────────────────────────────────────── */
  .skeleton { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px, 1fr)); gap: 13px; }
  .sk {
    height: 70px;
    border-radius: var(--r-card);
    background: var(--card);
    position: relative;
    overflow: hidden;
  }
  .sk::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, var(--line-strong), transparent);
    transform: translateX(-100%);
    animation: sweep 1.5s var(--e-inout) infinite;
  }
  @keyframes sweep { to { transform: translateX(100%); } }

  /* ── 进场 ───────────────────────────────────────────────── */
  .reveal { opacity: 0; transform: translateY(20px); }
  .reveal.in { opacity: 1; transform: translateY(0);
    transition: opacity .75s var(--e-out), transform .75s var(--e-out); }

  /* ══════════════════════════════════════════════════════════
     响应式
     ══════════════════════════════════════════════════════════ */
  @media (max-width: 900px) {
    .search { width: 148px; }
    .search:focus-within { width: 200px; }
  }
  @media (max-width: 600px) {
    .nav-inner { padding: 0 16px; gap: 10px; }
    .brand span { display: none; }
    .search { flex: 1; width: auto; }
    .search:focus-within { width: auto; }
    .nav-right { flex: 1; }
    .hero { padding: 40px 16px 26px; }
    .filters { padding: 11px 16px; }
    main { padding: 30px 16px 76px; }
    footer { padding: 22px 16px; flex-direction: column; align-items: flex-start; }
    .grid, .skeleton { grid-template-columns: 1fr; }
    .totop { right: 16px; bottom: 16px; width: 42px; height: 42px; }
    .kbd { display: none; }
    .hero .sub { margin-bottom: 24px; }
    .stats .item { padding-right: 20px; }
    .stats .item + .item { padding-left: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    html { scroll-behavior: auto; }
    .card { transform: none; opacity: 1; }
    .reveal { opacity: 1; transform: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a class="brand" href="#top" aria-label="回到顶部">
      <span class="brand-mark"></span><span id="brandText">常用网址</span>
    </a>
    <div class="nav-right">
      <div class="search" id="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
        </svg>
        <input id="q" type="search" placeholder="搜索站点" autocomplete="off" spellcheck="false" aria-label="搜索站点">
        <span class="kbd">/</span>
        <button class="clear" id="clear" type="button" aria-label="清空搜索">&times;</button>
      </div>
      <button class="icon-btn" id="theme" type="button" aria-label="切换深色模式" title="切换深色模式">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.7 13.2A8.6 8.6 0 1 1 10.8 3.3a6.7 6.7 0 0 0 9.9 9.9z"/>
        </svg>
      </button>
    </div>
  </div>
</nav>

<header class="hero" id="top">
  <div class="aurora"></div>
  <div class="hero-inner">
    <h1 class="reveal" id="heroTitle">常用网址</h1>
    <p class="sub reveal" id="heroSub">把每天要打开的站点放在一处</p>
    <div class="stats reveal" id="stats"></div>
  </div>
</header>

<div class="filters-wrap" id="filtersWrap">
  <div class="filters" id="filters"></div>
</div>

<main id="main">
  <div class="skeleton" id="skeleton">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>
</main>

<div class="empty" id="empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
  </svg>
  <h3 id="emptyTitle">没有匹配的站点</h3>
  <p id="emptyHint">换个关键词试试，或点「全部」查看所有站点。</p>
</div>

<button class="totop" id="totop" type="button" aria-label="回到顶部">
  <svg class="ring" viewBox="0 0 46 46" aria-hidden="true"><circle cx="23" cy="23" r="22"/></svg>
  <svg class="arrowup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
</button>

<footer>
  <span id="footCount"></span>
  <span>按 <b style="font-weight:600">/</b> 搜索 · 数据来自 <a href="links.json" target="_blank" rel="noopener">links.json</a></span>
</footer>

<script>
(function () {
  "use strict";

  var root = document.documentElement;
  var $ = function (id) { return document.getElementById(id); };
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ══════════════ 主题 ══════════════ */
  var saved = null;
  try { saved = localStorage.getItem("links-theme"); } catch (e) {}
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));

  $("theme").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("links-theme", next); } catch (e) {}
  });

  /* ══════════════ 工具 ══════════════ */
  var PALETTE = ["#0071e3", "#af52de", "#ff375f", "#ff9f0a", "#30d158", "#40c8e0", "#5e5ce6", "#ff6482"];

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
  }
  function colorOf(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function highlight(text, q) {
    var safe = esc(text);
    if (!q) return safe;
    var idx = safe.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return safe;
    return safe.slice(0, idx) + "<mark>" + safe.slice(idx, idx + q.length) + "</mark>" + safe.slice(idx + q.length);
  }

  /* ══════════════ 状态 ══════════════ */
  var DATA = { categories: [] };
  var activeCat = "all";
  var query = "";
  var cards = [];
  var filtersEl = $("filters");
  var mainEl = $("main");
  var emptyEl = $("empty");
  var qEl = $("q");
  var searchbox = $("searchbox");

  var secObserver = null;
  if (!reduceMotion && "IntersectionObserver" in window) {
    secObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("in"); secObserver.unobserve(en.target); }
      });
    }, { rootMargin: "140px 0px 0px 0px", threshold: 0 });
  }

  /* ══════════════ 卡片 ══════════════ */
  /* 图标来源采用级联回退：
     ① links.json 指定了 icon 就用站点官方图标（品牌保真、可离线）
     ② 失败则退回 favicon 聚合服务（能绕过部分站的防盗链/网络限制）
     ③ 都失败才降级为首字母色块
     实测：LINUX DO 直连 403 但聚合服务可取；小红书反之，故两者都要。 */
  function iconSources(link, host) {
    var list = [];
    if (link.icon) {
      var base = link.url.endsWith("/") ? link.url.slice(0, -1) : link.url;
      list.push(base + link.icon);
    }
    list.push("https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(host));
    return list;
  }

  function buildCard(link) {
    var host = hostOf(link.url);
    var initial = (link.name || host || "?").trim().charAt(0).toUpperCase();

    var a = document.createElement("a");
    a.className = "card";
    a.href = link.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = link.name + " — " + link.url;

    var av = document.createElement("span");
    av.className = "avatar";
    var img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.decoding = "async";

    /* 级联回退：逐个尝试候选源，全部失败才降级为首字母色块 */
    var sources = iconSources(link, host);
    var si = 0;
    function fail() {
      si++;
      if (si < sources.length) { img.src = sources[si]; return; }
      av.classList.add("failed");
      img.remove();
    }
    img.addEventListener("error", fail);
    /* 少数源会返回空白图且不报错，主动检测一次 */
    img.addEventListener("load", function () {
      if (!img.naturalWidth || !img.naturalHeight) fail();
    });
    img.src = sources[0];
    var fb = document.createElement("span");
    fb.className = "fb";
    fb.textContent = initial;
    fb.style.background = colorOf(link.name || host);
    av.appendChild(img);
    av.appendChild(fb);

    var info = document.createElement("span");
    info.className = "info";
    var t = document.createElement("span");
    t.className = "t";
    var d = document.createElement("span");
    d.className = "d";
    info.appendChild(t);
    info.appendChild(d);

    var arrow = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    arrow.setAttribute("class", "arrow");
    arrow.setAttribute("viewBox", "0 0 24 24");
    arrow.setAttribute("fill", "none");
    arrow.setAttribute("stroke", "currentColor");
    arrow.setAttribute("stroke-width", "2.4");
    arrow.setAttribute("stroke-linecap", "round");
    arrow.setAttribute("stroke-linejoin", "round");
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M5 12h13M13 6l6 6-6 6");
    arrow.appendChild(p);

    a.appendChild(av);
    a.appendChild(info);
    a.appendChild(arrow);

    if (!reduceMotion) {
      a.addEventListener("pointermove", function (e) {
        var r = a.getBoundingClientRect();
        a.style.setProperty("--mx", (e.clientX - r.left) + "px");
        a.style.setProperty("--my", (e.clientY - r.top) + "px");
      });
    }

    return {
      el: a,
      elName: t,
      elDesc: d,
      cat: link.__cat,
      name: link.name || host,
      desc: link.desc || host,
      hay: ((link.name || "") + " " + (link.desc || "") + " " + (link.url || "") + " " + host + " " +
            (Array.isArray(link.tags) ? link.tags.join(" ") : "")).toLowerCase()
    };
  }

  /* ══════════════ 渲染 ══════════════ */
  function render() {
    if ($("skeleton")) $("skeleton").remove();
    mainEl.innerHTML = "";
    filtersEl.innerHTML = "";
    cards = [];

    var cats = (DATA.categories || []).filter(function (c) { return c && c.links && c.links.length; });
    var totalAll = cats.reduce(function (n, c) { return n + c.links.length; }, 0);

    function chip(label, value, count) {
      /* 用 <a> 而非 <button>：既是筛选控件，也是可分享、可右键新开、
         可被键盘与读屏正常识别的链接 */
      var b = document.createElement("a");
      b.className = "chip";
      b.href = value === "all" ? "#" : "#cat=" + encodeURIComponent(value);
      b.setAttribute("aria-pressed", String(activeCat === value));
      b.dataset.value = value;
      var l = document.createElement("span");
      l.textContent = label;
      b.appendChild(l);
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      b.appendChild(n);
      b.addEventListener("click", function (e) {
        e.preventDefault();
        setCat(value);
        b.blur();
      });
      return b;
    }
    if (cats.length > 1) filtersEl.appendChild(chip("全部", "all", totalAll));
    cats.forEach(function (c) { filtersEl.appendChild(chip(c.name, c.name, c.links.length)); });

    cats.forEach(function (cat, ci) {
      var sec = document.createElement("section");
      sec.id = "c-" + cat.name;
      sec.dataset.cat = cat.name;
      if (!reduceMotion) sec.classList.add("reveal");

      var head = document.createElement("div");
      head.className = "sec-head";
      var h2 = document.createElement("h2");
      h2.textContent = cat.name;
      var meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = cat.links.length + " 个站点";
      head.appendChild(h2);
      head.appendChild(meta);
      sec.appendChild(head);

      var grid = document.createElement("div");
      grid.className = "grid";

      cat.links.forEach(function (raw) {
        var link = Object.assign({}, raw, { __cat: cat.name });
        var card = buildCard(link);
        cards.push(card);
        grid.appendChild(card.el);
      });

      sec.appendChild(grid);
      mainEl.appendChild(sec);

      if (!reduceMotion) {
        grid.querySelectorAll(".card").forEach(function (c, i) {
          setTimeout(function () { c.classList.add("in"); }, 40 + ci * 45 + Math.min(i * 24, 280));
        });
        if (secObserver) secObserver.observe(sec);
        else sec.classList.add("in");
      } else {
        grid.querySelectorAll(".card").forEach(function (c) { c.classList.add("in"); });
        sec.classList.add("in");
      }
    });

    $("footCount").textContent = "共 " + totalAll + " 个站点，分 " + cats.length + " 类";
    renderStats(totalAll, cats.length);

    /* hash 里的分类若不存在（域名变更、手工改址、旧链接）则回退到「全部」，
       绝不让用户看到一个空白页 */
    if (activeCat !== "all" && !cards.some(function (c) { return c.cat === activeCat; })) {
      activeCat = "all";
    }
    Array.prototype.forEach.call(filtersEl.children, function (c) {
      c.setAttribute("aria-pressed", String(c.dataset.value === activeCat));
    });

    /* #sec=分类名 → 渲染完成后滚动定位 */
    if (pendingSec) {
      var target = document.getElementById("c-" + pendingSec);
      if (target) {
        requestAnimationFrame(function () {
          target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
        });
      }
      pendingSec = null;
    }

    applyFilter();
  }

  /* 数字滚动：让统计栏有"落定"感 */
  function renderStats(total, cats) {
    var el = $("stats");
    el.innerHTML =
      '<div class="item"><b>0</b><span class="lbl">个站点</span></div>' +
      '<div class="item"><b>0</b><span class="lbl">个分类</span></div>';
    var bs = el.querySelectorAll("b");
    if (reduceMotion) {
      bs[0].textContent = total;
      bs[1].textContent = cats;
      return;
    }
    [[bs[0], total], [bs[1], cats]].forEach(function (pair, idx) {
      var node = pair[0], target = pair[1], start = performance.now(), dur = 780;
      setTimeout(function tick(now) {
        var t = Math.min(((now || performance.now()) - start) / dur, 1);
        var eased = 1 - Math.pow(1 - t, 3);
        node.textContent = Math.round(target * eased);
        if (t < 1) requestAnimationFrame(tick);
      }, idx * 90);
    });
  }

  /* hash 工具：用显式前缀区分两种语义，避免共用一个裸分类名导致解析冲突
     #cat=分类名 → 筛选     #sec=分类名 → 滚动到该分组 */
  function writeHash(kind, value) {
    try {
      if (!kind || !value) history.replaceState(null, "", location.pathname + location.search);
      else history.replaceState(null, "", "#" + kind + "=" + encodeURIComponent(value));
    } catch (e) {}
  }
  function readHash() {
    var raw = (location.hash || "").slice(1);
    if (!raw) return null;
    if (raw.indexOf("cat=") === 0) return { kind: "cat", value: decodeURIComponent(raw.slice(4)) };
    if (raw.indexOf("sec=") === 0) return { kind: "sec", value: decodeURIComponent(raw.slice(4)) };
    var legacy = decodeURIComponent(raw);
    /* 兼容更早版本的 #c-分类名 锚点写法：剥掉前缀后按分类处理 */
    if (legacy.indexOf("c-") === 0) {
      var name = legacy.slice(2);
      if (name) return { kind: "cat", value: name };
    }
    if (legacy) return { kind: "cat", value: legacy };
    return null;
  }

  /* 切换分类（用户点 chip） */
  function setCat(value) {
    var prev = activeCat;
    activeCat = value;
    Array.prototype.forEach.call(filtersEl.children, function (c) {
      c.setAttribute("aria-pressed", String(c.dataset.value === value));
    });
    writeHash(value === "all" ? "" : "cat", value === "all" ? "" : value);

    if (!reduceMotion && prev !== value) {
      var firstRects = new Map();
      cards.forEach(function (c) {
        if (!c.el.classList.contains("hide")) firstRects.set(c.el, c.el.getBoundingClientRect());
      });

      applyFilter();

      var moved = [];
      cards.forEach(function (c) {
        if (!firstRects.has(c.el) || c.el.classList.contains("hide")) return;
        var first = firstRects.get(c.el);
        var last = c.el.getBoundingClientRect();
        var dx = first.left - last.left, dy = first.top - last.top;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
        c.el.style.transition = "none";
        c.el.style.transform = "translate(" + dx + "px," + dy + "px)";
        moved.push(c.el);
      });

      requestAnimationFrame(function () {
        moved.forEach(function (el) {
          el.style.transition = "";
          el.classList.add("moving");
          el.style.transform = "";
          setTimeout(function () { el.classList.remove("moving"); }, 400);
        });
      });
    } else {
      applyFilter();
    }
  }

  function applyFilter() {
    var q = query.trim().toLowerCase();
    var visibleTotal = 0;
    var perCat = {};

    cards.forEach(function (c) {
      var okCat = activeCat === "all" || c.cat === activeCat;
      var okQ = !q || c.hay.indexOf(q) !== -1;
      var ok = okCat && okQ;
      c.el.classList.toggle("hide", !ok);
      if (ok) { visibleTotal++; perCat[c.cat] = (perCat[c.cat] || 0) + 1; }
      c.elName.innerHTML = highlight(c.name, q);
      c.elDesc.innerHTML = highlight(c.desc, q);
      c.el.setAttribute("aria-hidden", ok ? "false" : "true");
    });

    Array.prototype.forEach.call(mainEl.children, function (sec) {
      var n = perCat[sec.dataset.cat] || 0;
      sec.classList.toggle("hide", n === 0);
      var meta = sec.querySelector(".meta");
      if (meta) meta.textContent = n + " 个站点";
    });

    emptyEl.classList.toggle("show", visibleTotal === 0);
    /* 提示要分清原因：搜索无结果 / 该分类为空 / 分类不存在，否则会给出误导性建议 */
    if (visibleTotal === 0) {
      var title = $("emptyTitle"), hint = $("emptyHint");
      if (q) {
        title.textContent = "没有匹配的站点";
        hint.textContent = "换个关键词试试，或清空搜索框查看全部。";
      } else if (activeCat !== "all") {
        title.textContent = "「" + activeCat + "」下暂无站点";
        hint.textContent = "点上方「全部」查看所有站点。";
      } else {
        title.textContent = "还没有任何站点";
        hint.textContent = "编辑 links.json 添加后刷新即可。";
      }
    }
    searchbox.classList.toggle("has-value", q.length > 0);
  }

  /* ══════════════ 交互 ══════════════ */
  var timer = null;
  qEl.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      var prev = query;
      query = qEl.value;
      if (!reduceMotion && prev !== query) {
        var firstRects = new Map();
        cards.forEach(function (c) { firstRects.set(c.el, c.el.getBoundingClientRect()); });
        applyFilter();
        cards.forEach(function (c) {
          if (c.el.classList.contains("hide")) return;
          var first = firstRects.get(c.el);
          if (!first) return;
          var last = c.el.getBoundingClientRect();
          var dx = first.left - last.left, dy = first.top - last.top;
          if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
          c.el.style.transition = "none";
          c.el.style.transform = "translate(" + dx + "px," + dy + "px)";
          requestAnimationFrame(function () {
            c.el.style.transition = "";
            c.el.style.transform = "";
          });
        });
      } else {
        applyFilter();
      }
    }, 85);
  });
  $("clear").addEventListener("click", function () {
    qEl.value = ""; query = ""; applyFilter(); qEl.focus();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); qEl.select(); }
    if (e.key === "Escape" && document.activeElement === qEl) {
      qEl.value = ""; query = ""; applyFilter(); qEl.blur();
    }
  });

  /* 滚动：导航描边 + 环形进度 + 回顶 */
  var nav = $("nav"), fw = $("filtersWrap"), totop = $("totop");
  var ticking = false;
  function onScroll() {
    var y = window.scrollY || window.pageYOffset;
    nav.classList.toggle("scrolled", y > 8);
    fw.classList.toggle("scrolled", y > 8);
    totop.classList.toggle("show", y > 460);
    var max = document.documentElement.scrollHeight - window.innerHeight;
    var prog = max > 0 ? Math.min(y / max, 1) : 0;
    totop.style.setProperty("--progress", prog.toFixed(3));
    ticking = false;
  }
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
  }, { passive: true });
  onScroll();

  totop.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  });

  /* Hero 视差 */
  if (!reduceMotion) {
    var aurora = document.querySelector(".aurora");
    var hero = document.querySelector(".hero");
    window.addEventListener("scroll", function () {
      var y = Math.min(window.scrollY, 460);
      /* 极光改为左上定位后，这里不能再叠加 translateX(-50%) */
      if (aurora) aurora.style.transform = "translateY(" + (y * .14) + "px)";
      if (hero) hero.style.opacity = String(Math.max(1 - y / 520, 0));
    }, { passive: true });
  }

  /* Hero 进场 */
  function revealHero() {
    var els = document.querySelectorAll(".hero .reveal");
    if (reduceMotion) { els.forEach(function (el) { el.classList.add("in"); }); return; }
    els.forEach(function (el, i) {
      setTimeout(function () { el.classList.add("in"); }, 70 + i * 105);
    });
  }
  revealHero();

  /* 兜底：绝不因动画未触发而让内容不可见 */
  function forceRevealAll() {
    document.querySelectorAll("main section.reveal:not(.in)").forEach(function (s) { s.classList.add("in"); });
  }
  setTimeout(forceRevealAll, 1200);
  window.addEventListener("load", function () { setTimeout(forceRevealAll, 600); });

  /* hash 恢复：只在确认分类存在时才应用，否则安全回退到「全部」，
     绝不因为一个无法识别的 hash 而显示空白页 */
  var pendingHash = readHash();
  var pendingSec = null;
  if (pendingHash) {
    if (pendingHash.kind === "sec") pendingSec = pendingHash.value;
    else pendingHash.value && (activeCat = pendingHash.value);
  } else if (location.hash) {
    activeCat = "all";
  }

  /* 前进/后退时同步筛选与定位 */
  window.addEventListener("hashchange", function () {
    var h = readHash();
    if (!h) {
      if (activeCat !== "all") goCat("all");
      return;
    }
    if (h.kind === "sec") return;          /* 滚动类由浏览器处理 */
    goCat(h.value);
  });

  /* 不触发滚动、不写入历史的分类切换（供 hashchange 调用） */
  function goCat(value) {
    var known = value === "all" || cards.some(function (c) { return c.cat === value; });
    var target = known ? value : "all";
    activeCat = target;
    Array.prototype.forEach.call(filtersEl.children, function (c) {
      c.setAttribute("aria-pressed", String(c.dataset.value === target));
    });
    applyFilter();
  }

  /* ══════════════ 数据 ══════════════ */
  fetch("links.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (json) {
      DATA = json || { categories: [] };
      if (DATA.title) {
        $("heroTitle").textContent = DATA.title;
        $("brandText").textContent = DATA.title;
        document.title = DATA.title;
      }
      if (DATA.subtitle) $("heroSub").textContent = DATA.subtitle;
      else $("heroSub").remove();
      render();
    })
    .catch(function (err) {
      if ($("skeleton")) $("skeleton").remove();
      mainEl.innerHTML =
        '<div class="empty show" style="display:block">' +
        '<h3>数据加载失败</h3>' +
        '<p>无法读取 <code>links.json</code>（' + esc(err.message) + '）。<br>' +
        '若你是直接双击打开 HTML 文件，请改用本地服务器预览。</p></div>';
    });
})();
</script>
</body>
</html>
