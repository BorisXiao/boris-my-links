<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>常用网址</title>
<meta name="description" content="把每天要打开的站点放在一处">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
  /* ============================================================
     设计令牌 —— 参考 Apple 的灰阶与蓝，克制的对比
     ============================================================ */
  :root {
    --bg:            #fbfbfd;
    --bg-elevated:   #ffffff;
    --card:          #ffffff;
    --card-hover:    #ffffff;
    --nav-bg:        rgba(251, 251, 253, .72);
    --border:        rgba(0, 0, 0, .08);
    --border-strong: rgba(0, 0, 0, .14);
    --text:          #1d1d1f;
    --text-secondary:#6e6e73;
    --text-tertiary: #86868b;
    --accent:        #0071e3;
    --accent-soft:   rgba(0, 113, 227, .10);
    --shadow-sm:     0 1px 2px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.04);
    --shadow-md:     0 4px 12px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.08);
    --shadow-lg:     0 8px 24px rgba(0,0,0,.08), 0 24px 64px rgba(0,0,0,.12);
    --glow:          radial-gradient(140px circle at var(--mx,50%) var(--my,50%), rgba(0,113,227,.10), transparent 65%);
    --radius-card:   18px;
    --radius-pill:   980px;
    --ease-out:      cubic-bezier(.22, 1, .36, 1);
    --ease-spring:   cubic-bezier(.34, 1.56, .64, 1);
    --maxw:          1160px;
  }
  html[data-theme="dark"] {
    --bg:            #000000;
    --bg-elevated:   #0a0a0c;
    --card:          #1c1c1e;
    --card-hover:    #232326;
    --nav-bg:        rgba(0, 0, 0, .68);
    --border:        rgba(255, 255, 255, .10);
    --border-strong: rgba(255, 255, 255, .18);
    --text:          #f5f5f7;
    --text-secondary:#a1a1a6;
    --text-tertiary: #86868b;
    --accent:        #0a84ff;
    --accent-soft:   rgba(10, 132, 255, .16);
    --shadow-sm:     0 1px 2px rgba(0,0,0,.4);
    --shadow-md:     0 4px 16px rgba(0,0,0,.5);
    --shadow-lg:     0 8px 32px rgba(0,0,0,.6);
    --glow:          radial-gradient(160px circle at var(--mx,50%) var(--my,50%), rgba(10,132,255,.16), transparent 65%);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-feature-settings: "tnum" 1;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    transition: background .4s var(--ease-out), color .4s var(--ease-out);
  }
  ::selection { background: var(--accent-soft); color: var(--text); }

  /* 滚动条 —— 更纤细 */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 10px;
    border: 3px solid var(--bg);
  }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

  /* ============================================================
     导航 —— 毛玻璃 + 滚动后收窄
     ============================================================ */
  .nav {
    position: sticky; top: 0; z-index: 100;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid transparent;
    transition: border-color .3s var(--ease-out), background .3s var(--ease-out);
  }
  .nav.scrolled { border-bottom-color: var(--border); }
  .nav-inner {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 0 24px;
    height: 52px;
    display: flex; align-items: center; gap: 14px;
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    font-size: 15px; font-weight: 600;
    letter-spacing: -.01em;
    color: var(--text);
    text-decoration: none;
    white-space: nowrap;
  }
  .brand-mark {
    width: 21px; height: 21px; flex: none;
    border-radius: 6px;
    background: var(--text);
    position: relative;
    transition: transform .5s var(--ease-spring);
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 6px;
    border: 2px solid var(--bg);
    border-radius: 50%;
  }
  .brand:hover .brand-mark { transform: rotate(90deg) scale(1.08); }

  .nav-links { display: flex; gap: 2px; margin-left: 8px; overflow-x: auto; scrollbar-width: none; }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-link {
    flex: none;
    padding: 6px 12px;
    font-size: 13.5px;
    color: var(--text-secondary);
    text-decoration: none;
    border-radius: 8px;
    transition: color .2s, background .2s;
    white-space: nowrap;
  }
  .nav-link:hover { color: var(--text); background: var(--accent-soft); }

  .nav-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* 搜索 —— macOS 风格聚焦 */
  .search {
    position: relative;
    width: 190px;
    transition: width .45s var(--ease-out);
  }
  .search:focus-within { width: 280px; }
  .search svg {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    width: 14px; height: 14px; color: var(--text-tertiary); pointer-events: none;
  }
  #q {
    width: 100%;
    padding: 7px 30px 7px 31px;
    font: inherit; font-size: 13.5px;
    color: var(--text);
    background: var(--accent-soft);
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    outline: none;
    transition: background .3s, border-color .3s, box-shadow .3s;
  }
  #q::placeholder { color: var(--text-tertiary); }
  #q:focus {
    background: var(--card);
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  #q::-webkit-search-cancel-button { display: none; }
  .clear {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    width: 21px; height: 21px;
    display: none; place-items: center;
    background: none; border: 0; border-radius: 50%;
    color: var(--text-tertiary); cursor: pointer; font-size: 15px; line-height: 1;
    transition: background .2s, color .2s;
  }
  .clear:hover { background: var(--border); color: var(--text); }
  .search.has-value .clear { display: grid; }
  .kbd {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-size: 11px; color: var(--text-tertiary);
    padding: 1px 5px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    pointer-events: none;
    transition: opacity .2s;
  }
  .search:focus-within .kbd, .search.has-value .kbd { opacity: 0; }

  .icon-btn {
    flex: none;
    width: 32px; height: 32px;
    display: grid; place-items: center;
    background: none; border: 0; border-radius: 50%;
    color: var(--text-secondary);
    cursor: pointer;
    transition: background .2s, color .2s, transform .3s var(--ease-spring);
  }
  .icon-btn:hover { background: var(--accent-soft); color: var(--text); }
  .icon-btn:active { transform: scale(.9); }
  .icon-btn svg { width: 16px; height: 16px; }
  html[data-theme="dark"] .icon-sun { display: none; }
  html:not([data-theme="dark"]) .icon-moon { display: none; }

  /* ============================================================
     Hero —— 大标题 + 极光背景
     ============================================================ */
  .hero {
    position: relative;
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 76px 24px 34px;
    text-align: center;
    overflow: hidden;
  }
  .aurora {
    position: absolute;
    left: 50%; top: -180px;
    width: 900px; height: 520px;
    transform: translateX(-50%);
    pointer-events: none;
    opacity: .5;
    filter: blur(52px);
    background:
      radial-gradient(circle at 26% 42%, rgba(0,113,227,.34), transparent 46%),
      radial-gradient(circle at 70% 34%, rgba(175,82,222,.28), transparent 48%),
      radial-gradient(circle at 50% 70%, rgba(255,55,95,.18), transparent 52%);
    animation: drift 20s ease-in-out infinite alternate;
  }
  html[data-theme="dark"] .aurora { opacity: .42; }
  @keyframes drift {
    0%   { transform: translateX(-50%) translateY(0) scale(1); }
    50%  { transform: translateX(-52%) translateY(18px) scale(1.07); }
    100% { transform: translateX(-48%) translateY(-10px) scale(1.03); }
  }

  .hero h1 {
    position: relative;
    margin: 0 0 14px;
    font-size: clamp(38px, 6.2vw, 62px);
    font-weight: 700;
    letter-spacing: -.028em;
    line-height: 1.06;
  }
  .hero .sub {
    position: relative;
    margin: 0 0 26px;
    font-size: clamp(16px, 2vw, 19px);
    color: var(--text-secondary);
    letter-spacing: -.01em;
  }
  .stats {
    position: relative;
    display: inline-flex; gap: 26px;
    font-size: 13px; color: var(--text-tertiary);
  }
  .stats b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ============================================================
     分类筛选 —— 滑动药丸
     ============================================================ */
  .filters-wrap {
    position: sticky; top: 52px; z-index: 90;
    background: var(--nav-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid transparent;
    transition: border-color .3s var(--ease-out);
  }
  .filters-wrap.scrolled { border-bottom-color: var(--border); }
  .filters {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 11px 24px;
    display: flex; gap: 7px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 15px;
    font: inherit; font-size: 13.5px; font-weight: 500;
    color: var(--text-secondary);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    cursor: pointer;
    white-space: nowrap;
    transition: color .25s, background .25s, border-color .25s, transform .25s var(--ease-spring);
  }
  .chip:hover { color: var(--text); border-color: var(--border-strong); transform: translateY(-1px); }
  .chip:active { transform: scale(.96); }
  .chip[aria-pressed="true"] {
    color: #fff;
    background: var(--text);
    border-color: var(--text);
  }
  html[data-theme="dark"] .chip[aria-pressed="true"] { color: #000; }
  .chip .n {
    font-size: 11.5px;
    opacity: .6;
    font-variant-numeric: tabular-nums;
  }

  /* ============================================================
     内容区
     ============================================================ */
  main {
    max-width: var(--maxw);
    margin: 0 auto;
    padding: 40px 24px 90px;
  }
  section { margin-bottom: 52px; }
  section.hide { display: none; }

  .sec-head {
    display: flex; align-items: baseline; gap: 10px;
    margin: 0 0 18px;
  }
  .sec-head h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -.02em;
  }
  .sec-head .meta { font-size: 13px; color: var(--text-tertiary); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(252px, 1fr));
    gap: 14px;
  }

  /* ---------- 卡片 ---------- */
  .card {
    position: relative;
    display: flex; align-items: center; gap: 13px;
    padding: 15px 16px;
    min-width: 0;
    color: inherit;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transform: translateY(14px);
    opacity: 0;
    transition:
      transform .55s var(--ease-out),
      opacity .55s var(--ease-out),
      box-shadow .35s var(--ease-out),
      border-color .35s var(--ease-out),
      background .35s var(--ease-out);
  }
  .card.in { transform: translateY(0); opacity: 1; }
  .card.hide { display: none; }
  /* 鼠标跟随的柔光 */
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: var(--glow);
    opacity: 0;
    transition: opacity .35s var(--ease-out);
    pointer-events: none;
  }
  .card:hover::before { opacity: 1; }
  .card:hover {
    transform: translateY(-4px);
    background: var(--card-hover);
    border-color: var(--border-strong);
    box-shadow: var(--shadow-md);
  }
  .card:active { transform: translateY(-1px) scale(.995); }
  .card:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .avatar {
    position: relative;
    flex: none;
    width: 40px; height: 40px;
    border-radius: 11px;
    display: grid; place-items: center;
    background: var(--bg);
    border: 1px solid var(--border);
    overflow: hidden;
    transition: transform .4s var(--ease-spring);
  }
  .card:hover .avatar { transform: scale(1.09) rotate(-3deg); }
  .avatar img { width: 23px; height: 23px; display: block; }
  .avatar .fb {
    display: none;
    width: 100%; height: 100%;
    place-items: center;
    font-size: 16px; font-weight: 650;
    color: #fff;
  }
  .avatar.failed img { display: none; }
  .avatar.failed .fb { display: grid; }

  .info { min-width: 0; flex: 1; }
  .info .t {
    display: block;
    font-size: 15px; font-weight: 560;
    letter-spacing: -.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .info .d {
    display: block;
    margin-top: 2px;
    font-size: 12.5px;
    color: var(--text-tertiary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .arrow {
    flex: none;
    width: 15px; height: 15px;
    color: var(--text-tertiary);
    opacity: 0;
    transform: translateX(-5px);
    transition: opacity .3s var(--ease-out), transform .3s var(--ease-out);
  }
  .card:hover .arrow { opacity: .8; transform: translateX(0); }

  /* 搜索命中高亮 */
  mark {
    background: var(--accent-soft);
    color: var(--accent);
    border-radius: 3px;
    padding: 0 1px;
  }

  /* ---------- 空状态 ---------- */
  .empty {
    display: none;
    padding: 90px 20px;
    text-align: center;
  }
  .empty.show { display: block; animation: fadeUp .5s var(--ease-out) both; }
  .empty svg { width: 42px; height: 42px; color: var(--text-tertiary); opacity: .5; margin-bottom: 16px; }
  .empty h3 { margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .empty p { margin: 0; color: var(--text-secondary); font-size: 14px; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- 回到顶部 ---------- */
  .totop {
    position: fixed;
    right: 26px; bottom: 26px;
    z-index: 95;
    width: 42px; height: 42px;
    display: grid; place-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    box-shadow: var(--shadow-md);
    color: var(--text-secondary);
    cursor: pointer;
    opacity: 0; visibility: hidden;
    transform: translateY(12px) scale(.9);
    transition: opacity .35s var(--ease-out), transform .35s var(--ease-spring), visibility .35s, color .2s;
  }
  .totop.show { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }
  .totop:hover { color: var(--text); transform: translateY(-3px) scale(1.05); }
  .totop svg { width: 17px; height: 17px; }

  /* ---------- 页脚 ---------- */
  footer {
    border-top: 1px solid var(--border);
    padding: 26px 24px;
    max-width: var(--maxw);
    margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap;
    font-size: 12.5px;
    color: var(--text-tertiary);
  }
  footer a { color: var(--text-secondary); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  /* ---------- 加载态骨架 ---------- */
  .skeleton { display: grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap: 14px; }
  .sk {
    height: 72px;
    border-radius: var(--radius-card);
    background: linear-gradient(90deg, var(--card) 25%, var(--border) 50%, var(--card) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- 进场编排 ---------- */
  .reveal { opacity: 0; transform: translateY(18px); }
  .reveal.in {
    opacity: 1; transform: translateY(0);
    transition: opacity .7s var(--ease-out), transform .7s var(--ease-out);
  }

  /* ============================================================
     响应式
     ============================================================ */
  @media (max-width: 860px) {
    .search { width: 150px; }
    .search:focus-within { width: 200px; }
    .nav-links { display: none; }
  }
  @media (max-width: 560px) {
    .nav-inner { padding: 0 16px; gap: 10px; }
    .brand span { display: none; }
    .search { width: 100%; }
    .search:focus-within { width: 100%; }
    .nav-right { flex: 1; }
    .hero { padding: 46px 16px 24px; }
    .filters { padding: 10px 16px; }
    main { padding: 28px 16px 70px; }
    footer { padding: 22px 16px; flex-direction: column; align-items: flex-start; }
    .grid, .skeleton { grid-template-columns: 1fr; }
    .totop { right: 16px; bottom: 16px; }
    .kbd { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
    html { scroll-behavior: auto; }
    .card { transform: none; opacity: 1; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav-inner">
    <a class="brand" href="#top"><span class="brand-mark"></span><span id="brandText">常用网址</span></a>
    <div class="nav-links" id="navLinks"></div>
    <div class="nav-right">
      <div class="search" id="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
        </svg>
        <input id="q" type="search" placeholder="搜索" autocomplete="off" spellcheck="false" aria-label="搜索站点">
        <span class="kbd">/</span>
        <button class="clear" id="clear" type="button" aria-label="清空搜索">&times;</button>
      </div>
      <button class="icon-btn" id="theme" type="button" aria-label="切换深色模式" title="切换深色模式">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.7 13.2A8.6 8.6 0 1 1 10.8 3.3a6.7 6.7 0 0 0 9.9 9.9z"/>
        </svg>
      </button>
    </div>
  </div>
</nav>

<header class="hero" id="top">
  <div class="aurora"></div>
  <h1 class="reveal" id="heroTitle">常用网址</h1>
  <p class="sub reveal" id="heroSub">把每天要打开的站点放在一处</p>
  <div class="stats reveal" id="stats"></div>
</header>

<div class="filters-wrap" id="filtersWrap">
  <div class="filters" id="filters"></div>
</div>

<main id="main">
  <div class="skeleton" id="skeleton">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
    <div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>
</main>

<div class="empty" id="empty">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
    <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
  </svg>
  <h3>没有匹配的站点</h3>
  <p>换个关键词试试，或点「全部」查看所有站点。</p>
</div>

<button class="totop" id="totop" type="button" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
</button>

<footer>
  <span id="footCount"></span>
  <span>按 <b style="font-weight:600">/</b> 搜索 · 数据来自 <a href="links.json" target="_blank" rel="noopener">links.json</a></span>
</footer>

<script>
(function () {
  "use strict";

  var root = document.documentElement;
  var $ = function (id) { return document.getElementById(id); };
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------------- 主题 ---------------- */
  var saved = null;
  try { saved = localStorage.getItem("links-theme"); } catch (e) {}
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  root.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));

  $("theme").addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("links-theme", next); } catch (e) {}
  });

  /* ---------------- 工具 ---------------- */
  var PALETTE = ["#0071e3", "#af52de", "#ff375f", "#ff9f0a", "#30d158", "#40c8e0", "#5e5ce6", "#ff6482"];

  function hostOf(url) {
    try { return new URL(url).hostname.replace(/^www\./, ""); } catch (e) { return ""; }
  }
  function colorOf(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  /* 把匹配到的关键词包上 <mark>，输入已转义 */
  function highlight(text, q) {
    var safe = esc(text);
    if (!q) return safe;
    var idx = safe.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return safe;
    return safe.slice(0, idx) + "<mark>" + safe.slice(idx, idx + q.length) + "</mark>" + safe.slice(idx + q.length);
  }

  /* ---------------- 状态 ---------------- */
  var DATA = { categories: [] };
  var activeCat = "all";
  var query = "";
  var cards = [];
  var navLinksEl = $("navLinks");
  var filtersEl = $("filters");
  var mainEl = $("main");
  var emptyEl = $("empty");
  var qEl = $("q");
  var searchbox = $("searchbox");

  /* 进场动画观察器 —— 必须在内容渲染之后再观察，
     因为 section 是 fetch 完成后才动态创建的 */
  var secObserver = null;
  if (!reduceMotion && "IntersectionObserver" in window) {
    secObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) {
          en.target.classList.add("in");
          secObserver.unobserve(en.target);
        }
      });
    }, { rootMargin: "120px 0px 0px 0px", threshold: 0 });
  }

  /* ---------------- 构建卡片 ---------------- */
  function buildCard(link) {
    var host = hostOf(link.url);
    var initial = (link.name || host || "?").trim().charAt(0).toUpperCase();

    var a = document.createElement("a");
    a.className = "card";
    a.href = link.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.title = link.name + " — " + link.url;

    var av = document.createElement("span");
    av.className = "avatar";
    var img = document.createElement("img");
    img.loading = "lazy";
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    img.decoding = "async";
    img.src = "https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(host);
    img.addEventListener("error", function () {
      av.classList.add("failed");
      img.remove();
    });
    var fb = document.createElement("span");
    fb.className = "fb";
    fb.textContent = initial;
    fb.style.background = colorOf(link.name || host);
    av.appendChild(img);
    av.appendChild(fb);

    var info = document.createElement("span");
    info.className = "info";
    var t = document.createElement("span");
    t.className = "t";
    var d = document.createElement("span");
    d.className = "d";

    info.appendChild(t);
    info.appendChild(d);

    var arrow = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    arrow.setAttribute("class", "arrow");
    arrow.setAttribute("viewBox", "0 0 24 24");
    arrow.setAttribute("fill", "none");
    arrow.setAttribute("stroke", "currentColor");
    arrow.setAttribute("stroke-width", "2.4");
    arrow.setAttribute("stroke-linecap", "round");
    arrow.setAttribute("stroke-linejoin", "round");
    var p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", "M5 12h13M13 6l6 6-6 6");
    arrow.appendChild(p);

    a.appendChild(av);
    a.appendChild(info);
    a.appendChild(arrow);

    // 鼠标跟随柔光
    if (!reduceMotion) {
      a.addEventListener("pointermove", function (e) {
        var r = a.getBoundingClientRect();
        a.style.setProperty("--mx", (e.clientX - r.left) + "px");
        a.style.setProperty("--my", (e.clientY - r.top) + "px");
      });
    }

    return {
      el: a,
      elName: t,
      elDesc: d,
      cat: link.__cat,
      name: link.name || host,
      desc: link.desc || host,
      hay: ((link.name || "") + " " + (link.desc || "") + " " + (link.url || "") + " " + host).toLowerCase()
    };
  }

  /* ---------------- 渲染 ---------------- */
  function render() {
    if ($("skeleton")) $("skeleton").remove();
    mainEl.innerHTML = "";
    filtersEl.innerHTML = "";
    navLinksEl.innerHTML = "";
    cards = [];

    var cats = (DATA.categories || []).filter(function (c) { return c && c.links && c.links.length; });
    var totalAll = cats.reduce(function (n, c) { return n + c.links.length; }, 0);

    // 顶部导航锚点
    cats.forEach(function (c) {
      var a = document.createElement("a");
      a.className = "nav-link";
      a.href = "#c-" + encodeURIComponent(c.name);
      a.textContent = c.name;
      navLinksEl.appendChild(a);
    });

    // 筛选 chip
    function chip(label, value, count) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.setAttribute("aria-pressed", String(activeCat === value));
      b.dataset.value = value;
      var l = document.createElement("span");
      l.textContent = label;
      b.appendChild(l);
      var n = document.createElement("span");
      n.className = "n";
      n.textContent = count;
      b.appendChild(n);
      b.addEventListener("click", function () { setCat(value); });
      return b;
    }
    if (cats.length > 1) filtersEl.appendChild(chip("全部", "all", totalAll));
    cats.forEach(function (c) { filtersEl.appendChild(chip(c.name, c.name, c.links.length)); });

    // 分组
    cats.forEach(function (cat, ci) {
      var sec = document.createElement("section");
      sec.id = "c-" + cat.name;
      sec.dataset.cat = cat.name;
      if (!reduceMotion) sec.classList.add("reveal");

      var head = document.createElement("div");
      head.className = "sec-head";
      var h2 = document.createElement("h2");
      h2.textContent = cat.name;
      var meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = cat.links.length + " 个站点";
      head.appendChild(h2);
      head.appendChild(meta);
      sec.appendChild(head);

      var grid = document.createElement("div");
      grid.className = "grid";

      cat.links.forEach(function (raw, li) {
        var link = Object.assign({}, raw, { __cat: cat.name });
        var card = buildCard(link);
        card.el.style.transitionDelay = Math.min(li * 26, 320) + "ms";
        cards.push(card);
        grid.appendChild(card.el);
      });

      sec.appendChild(grid);
      mainEl.appendChild(sec);

      // 卡片交错上映；section 本身交给观察器做整体淡入
      if (!reduceMotion) {
        grid.querySelectorAll(".card").forEach(function (c, i) {
          setTimeout(function () { c.classList.add("in"); }, 40 + ci * 40 + Math.min(i * 26, 300));
        });
        if (secObserver) secObserver.observe(sec);
        else sec.classList.add("in");
      } else {
        grid.querySelectorAll(".card").forEach(function (c) { c.classList.add("in"); });
        sec.classList.add("in");
      }
    });

    $("footCount").textContent = "共 " + totalAll + " 个站点，分 " + cats.length + " 类";
    $("stats").innerHTML =
      "<span><b>" + totalAll + "</b> 个站点</span>" +
      "<span><b>" + cats.length + "</b> 个分类</span>";

    applyFilter();
  }

  function setCat(value) {
    activeCat = value;
    Array.prototype.forEach.call(filtersEl.children, function (c) {
      c.setAttribute("aria-pressed", String(c.dataset.value === value));
    });
    try {
      if (value === "all") history.replaceState(null, "", location.pathname + location.search);
      else history.replaceState(null, "", "#" + encodeURIComponent(value));
    } catch (e) {}
    applyFilter();
  }

  function applyFilter() {
    var q = query.trim().toLowerCase();
    var visibleTotal = 0;
    var perCat = {};

    cards.forEach(function (c) {
      var okCat = activeCat === "all" || c.cat === activeCat;
      var okQ = !q || c.hay.indexOf(q) !== -1;
      var ok = okCat && okQ;
      c.el.classList.toggle("hide", !ok);
      if (ok) {
        visibleTotal++;
        perCat[c.cat] = (perCat[c.cat] || 0) + 1;
      }
      // 高亮 / 还原
      c.elName.innerHTML = highlight(c.name, q);
      c.elDesc.innerHTML = highlight(c.desc, q);
      c.el.setAttribute("aria-hidden", ok ? "false" : "true");
    });

    Array.prototype.forEach.call(mainEl.children, function (sec) {
      var n = perCat[sec.dataset.cat] || 0;
      sec.classList.toggle("hide", n === 0);
      var meta = sec.querySelector(".meta");
      if (meta) meta.textContent = n + " 个站点";
    });

    emptyEl.classList.toggle("show", visibleTotal === 0);
    searchbox.classList.toggle("has-value", q.length > 0);
  }

  /* ---------------- 交互 ---------------- */
  var timer = null;
  qEl.addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(function () { query = qEl.value; applyFilter(); }, 90);
  });
  $("clear").addEventListener("click", function () {
    qEl.value = ""; query = ""; applyFilter(); qEl.focus();
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== qEl) { e.preventDefault(); qEl.focus(); qEl.select(); }
    if (e.key === "Escape" && document.activeElement === qEl) {
      qEl.value = ""; query = ""; applyFilter(); qEl.blur();
    }
  });

  /* 滚动：导航描边 + 回到顶部 */
  var nav = $("nav"), fw = $("filtersWrap"), totop = $("totop");
  var ticking = false;
  function onScroll() {
    var y = window.scrollY || window.pageYOffset;
    nav.classList.toggle("scrolled", y > 8);
    fw.classList.toggle("scrolled", y > 8);
    totop.classList.toggle("show", y > 480);
    ticking = false;
  }
  window.addEventListener("scroll", function () {
    if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
  }, { passive: true });
  onScroll();

  totop.addEventListener("click", function () {
    window.scrollTo({ top: 0, behavior: reduceMotion ? "auto" : "smooth" });
  });

  /* Hero 视差 */
  if (!reduceMotion) {
    var aurora = document.querySelector(".aurora");
    window.addEventListener("scroll", function () {
      var y = Math.min(window.scrollY, 420);
      if (aurora) aurora.style.transform = "translateX(-50%) translateY(" + (y * .18) + "px)";
    }, { passive: true });
  }

  /* Hero 进场编排（分组 section 的观察在 render() 里按需注册） */
  function revealHero() {
    var heroEls = document.querySelectorAll(".hero .reveal");
    if (reduceMotion) {
      heroEls.forEach(function (el) { el.classList.add("in"); });
      return;
    }
    heroEls.forEach(function (el, i) {
      setTimeout(function () { el.classList.add("in"); }, 80 + i * 110);
    });
  }
  revealHero();

  /* 兜底：无论观察器是否按预期工作，1.2s 后强制显示所有分组。
     宁可牺牲动画，也绝不让内容永久不可见。 */
  function forceRevealAll() {
    document.querySelectorAll("main section.reveal:not(.in)").forEach(function (s) {
      s.classList.add("in");
    });
  }
  setTimeout(forceRevealAll, 1200);
  window.addEventListener("load", function () { setTimeout(forceRevealAll, 600); });

  /* 从 hash 恢复分类 */
  var hash = decodeURIComponent((location.hash || "").slice(1));
  if (hash) activeCat = hash;

  /* ---------------- 载入数据 ---------------- */
  fetch("links.json", { cache: "no-cache" })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (json) {
      DATA = json || { categories: [] };
      if (DATA.title) {
        $("heroTitle").textContent = DATA.title;
        $("brandText").textContent = DATA.title;
        document.title = DATA.title;
      }
      if (DATA.subtitle) $("heroSub").textContent = DATA.subtitle;
      else $("heroSub").remove();
      render();
    })
    .catch(function (err) {
      if ($("skeleton")) $("skeleton").remove();
      mainEl.innerHTML =
        '<div class="empty show" style="display:block">' +
        '<h3>数据加载失败</h3>' +
        '<p>无法读取 <code>links.json</code>（' + esc(err.message) + '）。<br>' +
        '若你是直接双击打开 HTML 文件，请改用本地服务器预览。</p></div>';
    });
})();
</script>
</body>
</html>
